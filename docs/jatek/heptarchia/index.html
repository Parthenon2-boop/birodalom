<style>
/* HEPTARCHIA – a böngészős változat oldala: belépés, töltőképernyő, hibaüzenet, a vászon */
html, body, #canvas { margin: 0; padding: 0; border: 0; }
/* telefonon a lap ne görögjön, ne húzódjon (lehúzásra frissítés), ne nagyítson; a játék a teljes ablakban.
   SZÁNDÉKOSAN nincs position: fixed: az iPhone Safari (iOS 26) a billentyűzet bezárása és a címsor mozgása után
   a fix elemeket 10–24 képponttal eltolva rajzolja ki, a koppintást viszont a helyükön méri – így a koppintás
   a játékban mellément. A lap így sem görög: nincs mit görgetni, és a vásznon touch-action: none. */
html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
body { color: #e8d9b8; background: #120c07; touch-action: none; -webkit-text-size-adjust: 100%;
	-webkit-tap-highlight-color: transparent; font-family: Georgia, 'Times New Roman', serif; }
#canvas { display: block; position: absolute; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
	touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#canvas:focus { outline: none; }
/* a töltő / belépő lap görgethető (alacsony, fekvő telefonon nem fér ki), a dupla koppintás nem nagyít */
#tolto { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
	justify-content: flex-start; gap: 16px; padding: 16px; box-sizing: border-box; text-align: center; overflow-y: auto;
	-webkit-overflow-scrolling: touch; overscroll-behavior: contain;
	background: radial-gradient(ellipse at center, #2a1a0d 0%, #120c07 70%); z-index: 2; touch-action: pan-y; }
/* (középre, de ha nem fér ki, felülről görgethető: a két üres elem osztja el a maradék helyet) */
#tolto::before, #tolto::after { content: ''; flex: 1 0 0; margin: -8px 0; }
/* álló telefonon: „fordítsd el” (a játék fekvő képre készült, ugyanúgy, mint gépen) */
#fordit { display: none; position: absolute; inset: 0; z-index: 5; flex-direction: column; align-items: center;
	justify-content: center; gap: 18px; padding: 24px; box-sizing: border-box; text-align: center;
	background: radial-gradient(ellipse at center, #2a1a0d 0%, #120c07 75%); touch-action: none; }
#fordit svg { width: 96px; height: 96px; animation: fordul 2.4s ease-in-out infinite; }
@keyframes fordul { 0%, 25% { transform: rotate(0deg); } 55%, 100% { transform: rotate(-90deg); } }
#fordit .cim { font-size: 22px; color: #d6ad5c; }
#fordit .szoveg { font-size: 15px; color: #c9b48a; line-height: 1.45; max-width: 340px; }
#fordit button { padding: 12px 22px; font: 600 17px Georgia, serif; color: #1d1510; border: 0; border-radius: 4px;
	background: linear-gradient(#f0cf85, #d9a441); }
@media (orientation: portrait) { body.jatekban.erinto #fordit { display: flex; } }
#tolto h1 { margin: 0; font-size: clamp(34px, 7vw, 64px); letter-spacing: 0.12em; color: #d6ad5c;
	font-weight: normal; text-shadow: 0 2px 8px #000; }
#tolto .alcim { margin: 0; font-size: clamp(14px, 2.4vw, 19px); color: #b89b6a; font-style: italic; }
#csik { width: min(460px, 86vw); height: 14px; border: 1px solid #8a6630; border-radius: 3px;
	background: #1d130a; overflow: hidden; }
#csik > div { height: 100%; width: 0%; background: linear-gradient(#e3bd6b, #a87b2f); transition: width 0.2s; }
#csik.vegtelen > div { width: 30%; animation: jar 1.3s ease-in-out infinite alternate; }
@keyframes jar { from { margin-left: 0%; } to { margin-left: 70%; } }
#felirat { font-size: 15px; color: #c9b48a; min-height: 1.3em; }
#megjegyzes { font-size: 13px; color: #8f7b58; max-width: 520px; line-height: 1.45; }
#hiba { display: none; max-width: 560px; background: #4a2420; border: 1px solid #9b4b3a; border-radius: 6px;
	padding: 14px 16px; color: #f0dcd0; font-family: Arial, sans-serif; font-size: 14px; line-height: 1.4; white-space: pre-line; }
/* belépés */
#belepes { display: none; width: min(380px, 100%); background: #2f2219; border: 1px solid #6b4f2a; border-radius: 8px;
	padding: 18px 20px; box-sizing: border-box; text-align: left; }
#belepes p { margin: 0 0 12px; font-size: 15px; line-height: 1.45; color: #d8c7a3; }
#belepes label { display: block; margin: 0 0 10px; font-size: 14px; color: #c9b48a; }
#belepes input { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 9px 10px; font-size: 16px;
	background: #1d1510; color: #f1e4c6; border: 1px solid #6b4f2a; border-radius: 4px; }
#belepes input:focus { outline: 2px solid #d9a441; outline-offset: 0; }
#belepes button { width: 100%; margin-top: 4px; padding: 10px; font: 600 17px Georgia, serif; color: #1d1510;
	background: linear-gradient(#f0cf85, #d9a441); border: 0; border-radius: 4px; cursor: pointer; }
#belepes button:disabled { opacity: 0.6; cursor: default; }
#belepes .linkek { display: flex; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 14px; }
#belepes a { color: #f0cf85; }
#belepes .uzenet { min-height: 1.2em; margin-top: 10px; font-size: 14px; color: #f08a74; }
#tolto { scrollbar-color: #6b4f2a transparent; scrollbar-width: thin; }
/* alacsony (fekvő telefonos) képernyőn tömörebben */
@media (max-height: 520px) {
	#tolto { gap: 10px; padding: 10px 16px; }
	#tolto h1 { font-size: 30px; }
	#tolto .alcim { font-size: 14px; }
	#belepes { padding: 12px 16px; }
	#belepes p { font-size: 14px; margin-bottom: 8px; }
	#belepes label { margin-bottom: 6px; }
}
</style>

<body>
<canvas id="canvas">A böngésződ nem támogatja a canvas elemet. / Your browser does not support the canvas element.</canvas>

<div id="tolto">
	<h1>HEPTARCHIA</h1>

		<p id="b_szoveg"></p>

<div id="fordit">
	<svg viewBox="0 0 96 96" aria-hidden="true"><rect x="30" y="10" width="36" height="76" rx="6" fill="none"
		stroke="#d6ad5c" stroke-width="4"/><circle cx="48" cy="77" r="3" fill="#d6ad5c"/></svg>
	<div class="cim" id="f_cim"></div>
	<div class="szoveg" id="f_szoveg"></div>
	<button type="button" id="f_gomb"></button>
</div>

<script>
// ── A háttérbe került lap is fusson tovább ───────────────────────────────────
// A böngésző a rejtett lapon nem hívja a requestAnimationFrame-et, így a játék (és a többjátékos gazdagép
// is) megállna, amíg a játékos másik lapon van. Rejtett lapon egy Web Worker ütemez (másodpercenként ~20
// képkocka); a Worker üzeneteit a böngésző nem fojtja vissza úgy, mint a sima időzítőket.
(function () {
	const eredeti = window.requestAnimationFrame.bind(window);
	let varo = [];
	let worker = null;
	function lefuttat() {
		const most = performance.now();
		const lista = varo;
		varo = [];
		for (const cb of lista) cb(most);
	}
	function inditWorker() {
		if (worker) return;
		try {
			const kod = 'setInterval(function(){postMessage(0)},50);';
			worker = new Worker(URL.createObjectURL(new Blob([kod], { type: 'text/javascript' })));
			worker.onmessage = function () { if (document.hidden && varo.length) lefuttat(); };
		} catch (e) { worker = null; }
	}
	window.requestAnimationFrame = function (cb) {
		varo.push(cb);
		if (document.hidden) inditWorker();
		else eredeti(lefuttat);
		return 0;
	};
	document.addEventListener('visibilitychange', function () {
		if (document.hidden) inditWorker();
		else if (varo.length) eredeti(lefuttat);
	});
}());

// ── Többjátékos: a pillanatnyi hálózati akadás ne bontsa a játékot ───────────
// A böngésző a WebRTC-kapcsolatot már néhány másodpercnyi csend után „disconnected” állapotba teszi (wifi-
// váltás, mobilnet, a közvetítő akadása) – ez átmeneti, a kapcsolat többnyire magától visszaáll. A Godot
// viszont ezt végleges szakadásnak veszi, és azonnal kidobja a játékost (élő csatában a gép veszi át az
// oldalát, a vendégnél „A gazdagép kilépett”). Ezért a játék felé az átmeneti állapot „connected” marad;
// a valódi szakadást („failed”, „closed”, a bezárt adatcsatorna) ugyanúgy megkapja. Ha AKADAS_MAX_MP alatt
// sem áll helyre, a szakadás átmegy (az asztali változat ENet-kapcsolata ugyanennyit vár – Net.ENET_TIMEOUT).
// A valódi állapotváltások a konzolra kerülnek ([hep-rtc]), hibakereséshez.
(function () {
	const RTC = window.RTCPeerConnection;
	if (!RTC) return;
	const AKADAS_MAX_MP = 45;
	const lejart = new WeakSet();
	const idozito = new WeakMap();
	const valodi = {};
	for (const nev of ['connectionState', 'iceConnectionState']) {
		const d = Object.getOwnPropertyDescriptor(RTC.prototype, nev);
		if (!d || !d.get || !d.configurable) continue;
		valodi[nev] = d.get;
		Object.defineProperty(RTC.prototype, nev, {
			configurable: true, enumerable: d.enumerable,
			get: function () {
				const s = d.get.call(this);
				return s === 'disconnected' && !lejart.has(this) ? 'connected' : s;
			},
		});
	}
	function figyel(pc, nev, esemeny) {
		if (!valodi[nev]) return;
		pc.addEventListener(esemeny, function () {
			const s = valodi[nev].call(pc);
			console.warn('[hep-rtc] ' + nev + ': ' + s);
			clearTimeout(idozito.get(pc));
			if (s !== 'disconnected') { lejart.delete(pc); return; }
			idozito.set(pc, setTimeout(function () {
				if (valodi[nev].call(pc) !== 'disconnected') return;
				// nem állt helyre: a játék most kapja meg a szakadást
				lejart.add(pc);
				pc.dispatchEvent(new Event(esemeny));
			}, AKADAS_MAX_MP * 1000));
		});
	}
	window.RTCPeerConnection = function (beallitas) {
		const pc = new RTC(beallitas);
		// (a Godot a connectionState-et figyeli, ahol van; különben az iceConnectionState-et)
		if (valodi.connectionState) figyel(pc, 'connectionState', 'connectionstatechange');
		else figyel(pc, 'iceConnectionState', 'iceconnectionstatechange');
		return pc;
	};
	window.RTCPeerConnection.prototype = RTC.prototype;
}());


// ── Telefon, táblagép ────────────────────────────────────────────────────────
// ERINTO: van érintőképernyő – a játék (scripts/erintes.gd) ebből tudja, hogy az érintést maga fordítsa
// egéreseményekre (koppintás, hosszú nyomás, csippentés). DURVA: az elsődleges mutató az ujj (telefon,
// táblagép) – ott teljes képernyő, fekvő kép, és a képpontsűrűség legfeljebb 2 (a 3×-os telefonkijelzőn a
// játék így harmadannyi képpontot rajzol, alig láthatóan életlenebbül). ?erinto=1: fejlesztői próba gépen.
// (A koppintás helyét ez nem rontja el: a Godot a vászon képpontszámának és CSS-méretének arányával számol, nem a
// képpontsűrűséggel – a vászon mérete és az érintés helye mindig ugyanabból a sűrűségből jön.)
const ERINTO = (function () {
	let e = false;
	try { e = ('ontouchstart' in window) || navigator.maxTouchPoints > 0; } catch (err) { e = false; }
	return e || /[?&]erinto=1/.test(location.search);
}());
const DURVA = (function () {
	try { return matchMedia('(pointer: coarse)').matches || /[?&]erinto=1/.test(location.search); } catch (e) { return false; }
}());
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
window.hepErinto = ERINTO;
if (ERINTO) document.body.classList.add('erinto');
if (DURVA && (window.devicePixelRatio || 1) > 2) {
	try { Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 2; }, configurable: true }); } catch (e) {}
}
// iOS Safari: a két ujjas csippentés ne a lapot nagyítsa (a játékban az a nagyítás)
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
document.addEventListener('dblclick', function (e) { if (e.target && e.target.id === 'canvas') e.preventDefault(); });

// ── A koppintás pontosan ott, ahol az ujj (főleg iPhone / iPad) ──────────────
// A Godot az érintés helyét a vászon helyéhez méri (getBoundingClientRect). Ez csak akkor egyezik azzal, amit a
// játékos lát, ha a lap nincs elgörgetve, nincs felnagyítva, és a vásznat nem tolta el a böngésző. iPhone-on a
// belépéskori billentyűzet (és a játékbeli szövegmezőké) elgörgetheti / felnagyíthatja a lapot, és bezárás után
// ott is hagyhatja – ilyenkor a lapot visszatesszük a helyére (gépelés közben nem: akkor a mező kell, hogy látsszon).
function gepel() {
	const a = document.activeElement;
	return !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable);
}
function lap_helyre() {
	if (gepel()) return;
	const vv = window.visualViewport;
	// (iPhone-on a billentyűzet bezárása után a látható nézet úgy is elcsúszva maradhat, hogy a lap görgetése 0)
	if (window.scrollX || window.scrollY || (vv && (Math.abs(vv.offsetLeft) > 0.5 || Math.abs(vv.offsetTop) > 0.5))) window.scrollTo(0, 0);
	const se = document.scrollingElement;
	if (se && (se.scrollTop || se.scrollLeft)) { se.scrollTop = 0; se.scrollLeft = 0; }
	if (document.body && (document.body.scrollTop || document.body.scrollLeft)) { document.body.scrollTop = 0; document.body.scrollLeft = 0; }
	// felnagyított lap (iOS-en a user-scalable=no sem tiltja teljesen): a nézet beállításának újraírása visszaállítja
	if (vv && Math.abs(vv.scale - 1) > 0.01) {
		const m = document.querySelector('meta[name=viewport]');
		if (m) {
			const c = m.getAttribute('content');
			m.setAttribute('content', c + ', minimum-scale=1.0');
			setTimeout(function () { m.setAttribute('content', c); }, 50);
		}
	}
}
let helyre_idozito = 0;
function lap_helyre_kesobb() {
	clearTimeout(helyre_idozito);
	helyre_idozito = setTimeout(lap_helyre, 60);
}
['scroll', 'resize', 'orientationchange', 'focusout', 'pageshow'].forEach(function (e) { addEventListener(e, lap_helyre_kesobb, { passive: true }); });
if (window.visualViewport) {
	visualViewport.addEventListener('resize', lap_helyre_kesobb, { passive: true });
	visualViewport.addEventListener('scroll', lap_helyre_kesobb, { passive: true });
}

// Egy érintést pontosan EGY úton kap meg a játék: a Godot érintéseseményként (ebből csinál egéreseményt a játék
// scripts/erintes.gd-je). Ha a böngésző az érintés után még utánzott egéreseményt is küld a vászonra (mousedown,
// mouseup, click – iOS-en és Androidon is előfordul), azt a játék nem kapja meg, különben kétszer sülne el.
let utolso_erintes = -1e9;
['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(function (e) {
	addEventListener(e, function () { utolso_erintes = performance.now(); }, { capture: true, passive: true });
});
['mousedown', 'mouseup', 'mousemove', 'click', 'dblclick'].forEach(function (e) {
	addEventListener(e, function (ev) {
		if (!ERINTO || !ev.target || ev.target.id !== 'canvas') return;
		const utanzott = performance.now() - utolso_erintes < 800 ||
			(ev.sourceCapabilities && ev.sourceCapabilities.firesTouchEvents);
		if (!utanzott) return;
		ev.stopImmediatePropagation();
		if (ev.cancelable) ev.preventDefault();
	}, true);
});
// ?jel=1: a játék minden koppintás helyén egy kis jelet rajzol (iPhone-on így látszik, hová ér a koppintás)
window.hepErintoJel = /[?&]jel=1/.test(location.search);
// (ugyanekkor a bal felső sarokban a lap mért adatai is látszanak – egy képernyőképből kiderül, mi csúszott el)
if (window.hepErintoJel) {
	const adat = document.createElement('div');
	adat.style.cssText = 'position:absolute;left:4px;top:4px;z-index:9;padding:2px 5px;font:10px/1.3 monospace;color:#fff;' +
		'background:rgba(0,0,0,0.6);pointer-events:none;white-space:pre';
	document.body.appendChild(adat);
	const kerek = function (n) { return Math.round(n * 10) / 10; };
	const kiir = function (ev) {
		const c = document.getElementById('canvas'), r = c.getBoundingClientRect(), vv = window.visualViewport;
		const t = ev && ev.changedTouches && ev.changedTouches[0];
		adat.textContent = 'ablak ' + innerWidth + 'x' + innerHeight + '  kepernyo ' + screen.width + 'x' + screen.height +
			'  dpr ' + window.devicePixelRatio + '\nvaszon ' + c.width + 'x' + c.height + '  hely ' +
			[r.left, r.top, r.width, r.height].map(kerek).join(',') + '\ngorgetes ' + kerek(scrollX) + ',' + kerek(scrollY) +
			(vv ? '  nezet ' + [vv.offsetLeft, vv.offsetTop, vv.width, vv.height, vv.scale].map(kerek).join(',') : '') +
			(t ? '\nujj ' + kerek(t.clientX) + ',' + kerek(t.clientY) + '  lap ' + kerek(t.pageX) + ',' + kerek(t.pageY) +
				'  kepernyo ' + kerek(t.screenX) + ',' + kerek(t.screenY) : '');
	};
	['touchstart', 'resize', 'orientationchange'].forEach(function (e) { addEventListener(e, kiir, { capture: true, passive: true }); });
	setTimeout(kiir, 0);
}

// A hang feloldása: a telefonos böngésző (főleg iOS) csak a játékos érintése után engedi megszólalni a hangot.
// A játék hangkörnyezetét (AudioContext) megjegyezzük, és minden érintéskor / gombnyomáskor folytatjuk, ha áll.
(function () {
	const AC = window.AudioContext || window.webkitAudioContext;
	if (!AC) return;
	const lista = [];
	class HangKornyezet extends AC {
		constructor(...a) { super(...a); lista.push(this); }
	}
	window.AudioContext = HangKornyezet;
	if (window.webkitAudioContext) window.webkitAudioContext = HangKornyezet;
	function felold() {
		for (const c of lista) {
			if (c.state !== 'running' && c.state !== 'closed') c.resume().catch(function () {});
		}
	}
	['touchend', 'pointerup', 'mousedown', 'keydown'].forEach(function (e) {
		addEventListener(e, felold, { capture: true, passive: true });
	});
}());

// Teljes képernyő és fekvő kép (Androidon a fekvő zár csak teljes képernyőn megy; iPhone-on egyik sincs –
// ott a Főképernyőhöz adás ad teljes képernyőt)
function teljes_kepernyo() {
	const el = document.documentElement;
	const ker = el.requestFullscreen || el.webkitRequestFullscreen;
	let p = null;
	if (ker && !document.fullscreenElement && !document.webkitFullscreenElement) {
		try { p = ker.call(el, { navigationUI: 'hide' }); } catch (e) { p = null; }
	}
	Promise.resolve(p).then(function () {
		if (screen.orientation && screen.orientation.lock) return screen.orientation.lock('landscape');
	}).catch(function () { /* nem engedte: marad a „fordítsd el” jelzés */ });
}
const VAN_TELJES = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
// a játék indulása után az első érintés kéri (a böngésző csak a játékos mozdulatára engedi)
if (DURVA) {
	addEventListener('touchend', function elso() {
		if (!document.body.classList.contains('jatekban')) return;
		removeEventListener('touchend', elso, true);
		teljes_kepernyo();
	}, true);
}

// ── Szövegek a böngésző (vagy a honlapon választott) nyelvén ─────────────────
const NYELV = (function () {
	let n = '';
	try { n = localStorage.getItem('parth_lang') || ''; } catch (e) { n = ''; }
	if (!n) n = (navigator.language || 'en').slice(0, 2).toLowerCase();
	return ['hu', 'en', 'de'].indexOf(n) >= 0 ? n : 'en';

	// A csomag a gyorsítótárból (ha ez a verzió már megvan), különben letöltés a kapott linkről, haladásjelzéssel
	async function pck_betolt(url, ver, meret, haladas) {
		const KULCS = 'https://heptarchia.pck/' + encodeURIComponent(ver);
		let tar = null;
		try { tar = await caches.open('heptarchia-pck'); } catch (e) { tar = null; }

			const megvan = await tar.match(KULCS);
			if (megvan) return await megvan.arrayBuffer();
		}
		const r = await fetch(url);
		if (!r.ok || !r.body) throw new Error('HTTP ' + r.status);
		const osszes = Number(r.headers.get('Content-Length')) || meret;
		const olvaso = r.body.getReader();

		let most = 0;
		for (;;) {
			const { done, value } = await olvaso.read();
			if (done) break;
			reszek.push(value);
			most += value.length;
			haladas(most, osszes);

		let hol = 0;
		for (const r2 of reszek) { buf.set(r2, hol); hol += r2.length; }

			try {
				// a régebbi verziók törlése, az új eltétele
				for (const k of await tar.keys()) await tar.delete(k);
				await tar.put(KULCS, new Response(buf, { headers: { 'Content-Type': 'application/octet-stream' } }));
