<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>⚔ Kard és Mágia</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0a06;touch-action:none;user-select:none;-webkit-user-select:none;}
#c{display:block;position:absolute;top:0;left:0;}
#dpad{position:fixed;left:10px;bottom:14px;width:138px;height:138px;z-index:20;display:none;}
.dp{position:absolute;width:46px;height:46px;background:rgba(22,14,4,0.88);
  border:2px solid #7a5a2a;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:20px;color:#d4a84b;box-shadow:0 2px 8px #000c,inset 0 1px 0 #a87830;}
.dp:active{background:rgba(96,54,10,0.92);border-color:#d4a84b;}
#dp-u{left:46px;top:0}#dp-d{left:46px;bottom:0}#dp-l{left:0;top:46px}#dp-r{right:0;top:46px}
#abtns{position:fixed;right:10px;bottom:14px;z-index:20;display:none;flex-direction:column;gap:9px;align-items:flex-end;}
.abtn{padding:0 16px;height:44px;background:rgba(22,14,4,0.9);
  border:2px solid #7a5a2a;border-radius:8px;color:#d4a84b;font-size:13px;
  font-family:'Cinzel',serif;font-weight:700;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px #000c,inset 0 1px 0 #a87830;white-space:nowrap;}
.abtn:active{background:rgba(96,54,10,0.92);}
#mute{position:fixed;top:10px;right:10px;z-index:30;width:44px;height:44px;
  background:rgba(22,14,4,0.85);border:2px solid #7a5a2a;border-radius:50%;
  color:#d4a84b;font-size:18px;display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dpad">
  <div class="dp" id="dp-u">▲</div><div class="dp" id="dp-l">◀</div>
  <div class="dp" id="dp-r">▶</div><div class="dp" id="dp-d">▼</div>
</div>
<div id="abtns">
  <div class="abtn" id="ab-inv">🎒 Táska</div>
  <div class="abtn" id="ab-stair">⬇ Lépcső</div>
  <div class="abtn" id="ab-menu">☰ Menü</div>
</div>
<div id="mute">🔊</div>
<script>
// ══════════ SETUP ══════════
const canvas=document.getElementById('c');
let ctx=canvas.getContext('2d');
let W=0,H=0;
const IS_MOBILE=('ontouchstart' in window)||window.innerWidth<760;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);
const SERIF="Cinzel,Georgia,serif";
const MONO="'Courier New',monospace";

// ══════════ AUDIO ENGINE (WebAudio, no files) ══════════
let AC=null,masterGain=null,musicGain=null,muted=false,musicNodes=[];
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    masterGain=AC.createGain();masterGain.gain.value=0.6;masterGain.connect(AC.destination);
    musicGain=AC.createGain();musicGain.gain.value=0.22;musicGain.connect(masterGain);
  }catch(e){}
}
function setMute(m){muted=m;if(masterGain)masterGain.gain.value=m?0:0.6;
  document.getElementById('mute').textContent=m?'🔇':'🔊';}
document.getElementById('mute').addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();initAudio();setMute(!muted);},{passive:false});
document.getElementById('mute').addEventListener('mousedown',e=>{e.stopPropagation();initAudio();setMute(!muted);});

function noiseBuf(dur){
  const len=AC.sampleRate*dur|0;
  const buf=AC.createBuffer(1,len,AC.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  return buf;
}
// ── SFX ──
function sfxStep(){
  if(!AC||muted)return;
  const t=AC.currentTime;
  const src=AC.createBufferSource();src.buffer=noiseBuf(0.07);
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=300+Math.random()*150;
  const g=AC.createGain();g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.07);
  src.connect(f).connect(g).connect(masterGain);src.start(t);src.stop(t+0.08);
}
function sfxSword(){
  if(!AC||muted)return;
  const t=AC.currentTime;
  // Metallic clang: two detuned squares pitch dropping + noise
  for(const fr of [880,1320]){
    const o=AC.createOscillator();o.type='square';
    o.frequency.setValueAtTime(fr,t);o.frequency.exponentialRampToValueAtTime(fr*0.4,t+0.12);
    const g=AC.createGain();g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    o.connect(g).connect(masterGain);o.start(t);o.stop(t+0.16);
  }
  const src=AC.createBufferSource();src.buffer=noiseBuf(0.1);
  const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=3000;
  const g=AC.createGain();g.gain.setValueAtTime(0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
  src.connect(f).connect(g).connect(masterGain);src.start(t);
}
function sfxGrowl(){
  if(!AC||muted)return;
  const t=AC.currentTime;
  const o=AC.createOscillator();o.type='sawtooth';
  const base=55+Math.random()*35;
  o.frequency.setValueAtTime(base,t);
  o.frequency.linearRampToValueAtTime(base*0.7,t+0.35);
  const lfo=AC.createOscillator();lfo.frequency.value=18+Math.random()*12;
  const lg=AC.createGain();lg.gain.value=base*0.4;
  lfo.connect(lg).connect(o.frequency);
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=500;
  const g=AC.createGain();g.gain.setValueAtTime(0.001,t);
  g.gain.linearRampToValueAtTime(0.18,t+0.05);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
  o.connect(f).connect(g).connect(masterGain);
  o.start(t);o.stop(t+0.45);lfo.start(t);lfo.stop(t+0.45);
}
function sfxShoot(){
  if(!AC||muted)return;
  const t=AC.currentTime;
  const src=AC.createBufferSource();src.buffer=noiseBuf(0.25);
  const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=6;
  f.frequency.setValueAtTime(600,t);f.frequency.exponentialRampToValueAtTime(3200,t+0.2);
  const g=AC.createGain();g.gain.setValueAtTime(0.22,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.25);
  src.connect(f).connect(g).connect(masterGain);src.start(t);
}
function sfxCannon(){
  if(!AC||muted)return;
  const t=AC.currentTime;
  const src=AC.createBufferSource();src.buffer=noiseBuf(0.4);
  const f=AC.createBiquadFilter();f.type='lowpass';
  f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(80,t+0.35);
  const g=AC.createGain();g.gain.setValueAtTime(0.4,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
  src.connect(f).connect(g).connect(masterGain);src.start(t);
}
function sfxHit(){
  if(!AC||muted)return;
  const t=AC.currentTime;
  const src=AC.createBufferSource();src.buffer=noiseBuf(0.12);
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=700;
  const g=AC.createGain();g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
  src.connect(f).connect(g).connect(masterGain);src.start(t);
}
function sfxChest(){
  if(!AC||muted)return;
  const t=AC.currentTime;
  [523,659,784,1047].forEach((fr,i)=>{
    const o=AC.createOscillator();o.type='sine';o.frequency.value=fr;
    const g=AC.createGain();
    g.gain.setValueAtTime(0.001,t+i*0.08);
    g.gain.linearRampToValueAtTime(0.12,t+i*0.08+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+i*0.08+0.35);
    o.connect(g).connect(masterGain);o.start(t+i*0.08);o.stop(t+i*0.08+0.4);
  });
}
function sfxLevelUp(){
  if(!AC||muted)return;
  const t=AC.currentTime;
  [392,494,587,784].forEach((fr,i)=>{
    const o=AC.createOscillator();o.type='triangle';o.frequency.value=fr;
    const g=AC.createGain();
    g.gain.setValueAtTime(0.001,t+i*0.09);
    g.gain.linearRampToValueAtTime(0.15,t+i*0.09+0.03);
    g.gain.exponentialRampToValueAtTime(0.001,t+i*0.09+0.4);
    o.connect(g).connect(masterGain);o.start(t+i*0.09);o.stop(t+i*0.09+0.45);
  });
}
function sfxDeath(){
  if(!AC||muted)return;
  const t=AC.currentTime;
  const o=AC.createOscillator();o.type='sawtooth';
  o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(40,t+0.8);
  const g=AC.createGain();g.gain.setValueAtTime(0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.85);
  o.connect(g).connect(masterGain);o.start(t);o.stop(t+0.9);
}
// ══════════ DUNGEON SCORE ══════════
// Rich layered ambient score — 7 layers:
//   1. Deep sub-bass drones   (A1/E2 beating pair, cave rumble)
//   2. Soul-breath wind noise  (filtered noise swells)
//   3. String pad              (Am chord, slow swell, warm filter)
//   4. Dark choir vowel        (AM-modulated oscillator cluster)
//   5. Haunting flute melody   (Phrygian pentatonic, vibrato, echo)
//   6. Ghostly counter-melody  (slower, higher register, offset)
//   7. Cave drip bells         (inharmonic sine pairs, long decay)
//   8. Heartbeat percussion    (lub-dub filtered noise)

let _musicStarted=false;

function startMusic(){
  if(!AC||_musicStarted)return;
  _musicStarted=true;

  const now=AC.currentTime;

  // ── 1. Sub-bass drones ──
  [[55,55.28,'sine',0.20],[82.41,82.70,'triangle',0.09],[36.71,36.60,'sine',0.12]].forEach(([f1,f2,type,vol],i)=>{
    const g=AC.createGain();g.gain.value=0;
    g.gain.linearRampToValueAtTime(vol,now+4+i*1.5);
    const lfo=AC.createOscillator();lfo.frequency.value=0.035+i*0.013;
    const lg=AC.createGain();lg.gain.value=vol*0.08;
    lfo.connect(lg).connect(g.gain);
    [f1,f2].forEach(f=>{const o=AC.createOscillator();o.type=type;o.frequency.value=f;o.connect(g);o.start();musicNodes.push(o);});
    const flt=AC.createBiquadFilter();flt.type='lowpass';flt.frequency.value=280+i*40;
    g.connect(flt).connect(musicGain);lfo.start();musicNodes.push(lfo);
  });

  // ── 2. Soul-breath: filtered noise swells ──
  function breathSwell(){
    if(!AC||muted){setTimeout(breathSwell,7000);return;}
    const t=AC.currentTime;
    const dur=6+Math.random()*5;
    const len=Math.ceil(AC.sampleRate*dur);
    const buf=AC.createBuffer(1,len,AC.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=AC.createBufferSource();src.buffer=buf;
    const bp=AC.createBiquadFilter();bp.type='bandpass';bp.Q.value=8;
    // Pitch the breath to a note in Am
    const breathNotes=[110,130.81,146.83,164.81,196];
    bp.frequency.value=breathNotes[Math.floor(Math.random()*breathNotes.length)]*2;
    const g=AC.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.028+Math.random()*0.018,t+dur*0.35);
    g.gain.linearRampToValueAtTime(0,t+dur);
    src.connect(bp).connect(g).connect(musicGain);src.start(t);
    setTimeout(breathSwell,dur*1000*0.6+Math.random()*4000);
  }
  setTimeout(breathSwell,800);

  // ── 3. String pad: Am chord A3-C4-E4-G4 ──
  const padFreqs=[220,261.63,329.63,392,493.88];
  const padG=AC.createGain();padG.gain.value=0;
  padFreqs.forEach((f,i)=>{
    const o=AC.createOscillator();o.type='triangle';o.frequency.value=f*(1+i*0.00035);
    const o2=AC.createOscillator();o2.type='sine';o2.frequency.value=f*1.0028;
    o.connect(padG);o2.connect(padG);o.start();o2.start();musicNodes.push(o,o2);
  });
  const padFlt=AC.createBiquadFilter();padFlt.type='lowpass';padFlt.frequency.value=900;padFlt.Q.value=0.7;
  padG.connect(padFlt).connect(musicGain);
  padG.gain.linearRampToValueAtTime(0.038,now+9);
  const padLfo=AC.createOscillator();padLfo.frequency.value=0.055;
  const padLg=AC.createGain();padLg.gain.value=0.009;
  padLfo.connect(padLg).connect(padG.gain);padLfo.start();musicNodes.push(padLfo);

  // ── 4. Dark choir: AM modulated cluster ──
  const choirFreqs=[220,220*1.189,220*1.498,220*1.782]; // Am-ish chord
  const choirG=AC.createGain();choirG.gain.value=0;
  choirFreqs.forEach((f,i)=>{
    const carrier=AC.createOscillator();carrier.type='sine';carrier.frequency.value=f;
    const mod=AC.createOscillator();mod.frequency.value=3.2+i*0.7; // vowel tremolo
    const modg=AC.createGain();modg.gain.value=f*0.012;
    mod.connect(modg).connect(carrier.frequency);
    const og=AC.createGain();og.gain.value=0.022-i*0.004;
    carrier.connect(og).connect(choirG);
    carrier.start();mod.start();musicNodes.push(carrier,mod);
  });
  const choirFlt=AC.createBiquadFilter();choirFlt.type='bandpass';choirFlt.frequency.value=520;choirFlt.Q.value=1.4;
  choirG.connect(choirFlt).connect(musicGain);
  choirG.gain.linearRampToValueAtTime(0.9,now+12);

  // ── 5. Haunting flute melody ──
  const MEL_SCALE=[110,123.47,130.81,146.83,164.81,174.61,196,220,246.94,261.63,293.66,329.63];
  const PHRASE_A=[0,2,1,0,4,3,2,0,5,4,3,2,6,5,4,0];
  const PHRASE_B=[2,4,5,4,2,0,3,2,1,3,4,2,5,4,3,1];
  let melIdx=0,phraseGen=0;
  function playMelNote(){
    if(!AC||muted){setTimeout(playMelNote,800);return;}
    const t=AC.currentTime;
    const phrase=phraseGen%3===2?PHRASE_B:PHRASE_A;
    const transpose=[1,0.9439,1.0595][phraseGen%3];
    const baseFreq=MEL_SCALE[phrase[melIdx%phrase.length]]*transpose;
    melIdx++;if(melIdx%phrase.length===0)phraseGen++;
    const dur=0.45+Math.random()*0.5;
    const og=AC.createGain();
    og.gain.setValueAtTime(0,t);
    og.gain.linearRampToValueAtTime(0.062,t+0.08);
    og.gain.setValueAtTime(0.062,t+dur*0.5);
    og.gain.exponentialRampToValueAtTime(0.001,t+dur+0.22);
    const osc=AC.createOscillator();osc.type='sine';osc.frequency.value=baseFreq;
    const osc2=AC.createOscillator();osc2.type='triangle';osc2.frequency.value=baseFreq*2;
    const osc2g=AC.createGain();osc2g.gain.value=0.18;
    const vib=AC.createOscillator();vib.frequency.value=5+Math.random()*1.4;
    const vg=AC.createGain();vg.gain.value=baseFreq*0.013;
    vib.connect(vg).connect(osc.frequency);
    osc.connect(og);osc2.connect(osc2g).connect(og);
    // Echo chain
    const dly=AC.createDelay(1.2);dly.delayTime.value=0.28;
    const dlg=AC.createGain();dlg.gain.value=0.22;
    const dly2=AC.createDelay(1.2);dly2.delayTime.value=0.56;
    const dlg2=AC.createGain();dlg2.gain.value=0.10;
    og.connect(dly);dly.connect(dlg).connect(musicGain);
    dlg.connect(dly2);dly2.connect(dlg2).connect(musicGain);
    og.connect(musicGain);
    [osc,osc2,vib].forEach(o=>{o.start(t);o.stop(t+dur+1.5);});
    const rest=melIdx%5===0?Math.random()*1200+400:0;
    setTimeout(playMelNote,500+rest);
  }
  setTimeout(playMelNote,5000);

  // ── 6. Ghostly counter-melody (higher, slower) ──
  const GHOST_SCALE=[220,261.63,293.66,329.63,392,440,523.25,587.33];
  const GHOST_PHRASE=[0,2,4,3,1,0,5,4,2,1,3,2,0,4,3,1];
  let ghostIdx=0;
  function playGhostNote(){
    if(!AC||muted){setTimeout(playGhostNote,1600);return;}
    const t=AC.currentTime;
    const freq=GHOST_SCALE[GHOST_PHRASE[ghostIdx%GHOST_PHRASE.length]];
    ghostIdx++;
    const dur=1.2+Math.random()*1.0;
    const og=AC.createGain();
    og.gain.setValueAtTime(0,t);
    og.gain.linearRampToValueAtTime(0.032,t+0.18);
    og.gain.exponentialRampToValueAtTime(0.001,t+dur+0.6);
    const osc=AC.createOscillator();osc.type='sine';osc.frequency.value=freq;
    const vib=AC.createOscillator();vib.frequency.value=3.8;
    const vg=AC.createGain();vg.gain.value=freq*0.008;
    vib.connect(vg).connect(osc.frequency);
    // Long reverb tail via two nested delays
    const dly=AC.createDelay(2);dly.delayTime.value=0.45;
    const dlg=AC.createGain();dlg.gain.value=0.30;
    const dly2=AC.createDelay(2);dly2.delayTime.value=0.90;
    const dlg2=AC.createGain();dlg2.gain.value=0.14;
    osc.connect(og);og.connect(musicGain);
    og.connect(dly);dly.connect(dlg).connect(musicGain);
    dlg.connect(dly2);dly2.connect(dlg2).connect(musicGain);
    [osc,vib].forEach(o=>{o.start(t);o.stop(t+dur+2.5);});
    const rest=ghostIdx%3===0?Math.random()*2000+500:0;
    setTimeout(playGhostNote,1100+rest);
  }
  setTimeout(playGhostNote,8500);

  // ── 7. Cave drip bells ──
  function cavedrip(){
    if(!AC||muted){setTimeout(cavedrip,5000);return;}
    const t=AC.currentTime;
    const bases=[110,138.59,164.81,185,220,246.94,277.18,293.66];
    const fr=bases[Math.floor(Math.random()*bases.length)];
    // Inharmonic pair for metallic bell
    const ratios=[1,2.756,5.404];
    const vols=[0.052,0.022,0.009];
    ratios.forEach((r,i)=>{
      const o=AC.createOscillator();o.type='sine';o.frequency.value=fr*r;
      const g=AC.createGain();
      const decay=4.5-i*1.2;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(vols[i],t+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,t+decay);
      o.connect(g).connect(musicGain);o.start(t);o.stop(t+decay+0.2);
    });
    setTimeout(cavedrip,4000+Math.random()*10000);
  }
  setTimeout(cavedrip,1500);

  // ── 8. Heartbeat percussion ──
  function heartbeat(){
    if(!AC||muted){setTimeout(heartbeat,2500);return;}
    const t=AC.currentTime;
    [0,0.36].forEach((offset,beat)=>{
      const bt=t+offset;
      const len=AC.sampleRate*0.22|0;
      const buf=AC.createBuffer(1,len,AC.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(len*0.20));
      const src=AC.createBufferSource();src.buffer=buf;
      const f=AC.createBiquadFilter();f.type='lowpass';
      f.frequency.setValueAtTime(280,bt);f.frequency.exponentialRampToValueAtTime(50,bt+0.22);
      const g=AC.createGain();
      g.gain.setValueAtTime(beat===0?0.46:0.24,bt);
      g.gain.exponentialRampToValueAtTime(0.001,bt+0.28);
      src.connect(f).connect(g).connect(masterGain);src.start(bt);
    });
    setTimeout(heartbeat,1800+Math.random()*900);
  }
  setTimeout(heartbeat,2500);
}

// ── Auto-start: try immediately, fall back to first interaction ──
function tryAutoStart(){
  if(_musicStarted)return;
  initAudio();
  if(AC){
    if(AC.state==='running'){startMusic();}
    else if(AC.state==='suspended'){
      AC.resume().then(()=>{startMusic();}).catch(()=>{});
    }
  }
}
// Attempt right away (works on some browsers without gesture)
try{tryAutoStart();}catch(e){}
// Guaranteed fallback: first user interaction
['touchstart','mousedown','keydown'].forEach(ev=>{
  document.addEventListener(ev,()=>{
    initAudio();
    if(AC&&AC.state==='suspended')AC.resume().then(()=>{startMusic();}).catch(()=>{});
    else startMusic();
  },{once:false});
});

// ══════════ PALETTE / CONST ══════════
const P={parch:'#2a1e0e',parchLt:'#3c2c18',parchEdge:'#7a5a2a',parchGold:'#d4a84b',
  ink:'#c8a870',inkDark:'#8a7050',vein:'#d03030',hudBg:'#140e06',hudBorder:'#5a3a14',
  common:'#787878',rare:'#3070d8',epic:'#9030d0',legendary:'#d89000'};
const RARITY={
  common:{label:'Közönséges',border:P.common,glow:'#a8a8a8',mult:1.0},
  rare:{label:'Ritka',border:P.rare,glow:'#70b0ff',mult:1.6},
  epic:{label:'Nagyon ritka',border:P.epic,glow:'#d070ff',mult:2.4},

// ══════════ MAP / GAME CONSTANTS ══════════
const MAP_W=80,MAP_H=60,FOV_R=8,MAX_LEVEL=5;
const TILE=IS_MOBILE?Math.max(30,Math.floor(Math.min(W,H)/12)):40;
const T={WALL:0,FLOOR:1,STAIR:3};
class Room{
  constructor(x,y,w,h){this.x=x;this.y=y;this.w=w;this.h=h;}
  center(){return[this.x+Math.floor(this.w/2),this.y+Math.floor(this.h/2)];}
  intersects(o,p=1){return this.x-p<o.x+o.w&&this.x+this.w+p>o.x&&this.y-p<o.y+o.h&&this.y+this.h+p>o.y;}
}
function generateMap(level){
  const tiles=Array.from({length:MAP_W},()=>new Uint8Array(MAP_H));
  const rooms=[];const target=50+level*5;
  for(let a=0;a<3000&&rooms.length<target;a++){
    const w=rnd(4,11),h=rnd(3,8);
    const x=rnd(1,MAP_W-w-2),y=rnd(1,MAP_H-h-2);
    const room=new Room(x,y,w,h);
    if(rooms.some(r=>room.intersects(r,1)))continue;
    for(let rx=room.x;rx<room.x+room.w;rx++)for(let ry=room.y;ry<room.y+room.h;ry++)tiles[rx][ry]=T.FLOOR;
    if(rooms.length>0){
      const[cx,cy]=room.center(),[px,py]=rooms[rooms.length-1].center();
      if(Math.random()<0.5){
        for(let tx=Math.min(cx,px);tx<=Math.max(cx,px);tx++)tiles[tx][py]=T.FLOOR;
        for(let ty=Math.min(cy,py);ty<=Math.max(cy,py);ty++)tiles[cx][ty]=T.FLOOR;
      }else{
        for(let ty=Math.min(cy,py);ty<=Math.max(cy,py);ty++)tiles[cx][ty]=T.FLOOR;
        for(let tx=Math.min(cx,px);tx<=Math.max(cx,px);tx++)tiles[tx][cy]=T.FLOOR;
      }
    }
    rooms.push(room);
  }
  const[sx,sy]=rooms[rooms.length-1].center();
  tiles[sx][sy]=T.STAIR;
  return{tiles,rooms};
}
function computeFOV(tiles,px,py){
  const vis=new Set();vis.add(`${px},${py}`);
  for(let a=0;a<360;a+=2){
    const rad=a*Math.PI/180;let dx=0,dy=0;
    const ca=Math.cos(rad),sa=Math.sin(rad);
    for(let i=0;i<FOV_R;i++){
      dx+=ca;dy+=sa;
      const tx=Math.round(px+dx),ty=Math.round(py+dy);
      if(tx<0||tx>=MAP_W||ty<0||ty>=MAP_H)break;
      vis.add(`${tx},${ty}`);
      if(tiles[tx][ty]===T.WALL)break;
    }
  }
  return vis;
}

function rollRarity(lvl){
  const w={common:Math.max(5,60-lvl*8),rare:25+lvl*2,epic:10+lvl*3,legendary:2+lvl*2};
  let r=Math.random()*Object.values(w).reduce((a,b)=>a+b,0);
  for(const[k,v]of Object.entries(w)){r-=v;if(r<=0)return k;}
  return 'common';
}
function makeItem(base,rarity,lvl){
  const R=RARITY[rarity];const m=R.mult*(1+lvl*0.12);
  const it={...base,rarity,R};
  if(base.baseDmg)it.dmg=Math.round(base.baseDmg*m);
  if(base.baseDef)it.def=Math.round(base.baseDef*m);
  if(base.healAmt)it.heal=Math.round(base.healAmt*(rarity==='legendary'?2:1));
  if(base.maxHpUp)it.maxHpUp=Math.round(base.maxHpUp*m);
  if(base.atkUp)it.atkUp=Math.round(base.atkUp*(rarity==='legendary'?2:1));
  if(base.defUp)it.defUp=Math.round(base.defUp*(rarity==='legendary'?2:1));
  if(base.damage)it.damage=Math.round(base.damage*m);
  it.label=rarity==='legendary'?`✦ ${base.name}`:rarity==='epic'?`★ ${base.name}`:base.name;
  return it;
}
function randItem(lvl){return makeItem(pick(ITEM_BASES),rollRarity(lvl),lvl);}
function itemCol(it){

    heal:'#40c860',maxheal:'#40c860',fireball:'#e05010',atk_up:'#e05050',def_up:'#5080e0'};
  return c[it.subtype]||'#c8b890';
}

    ctx.fillStyle='#c8a030';
    ctx.beginPath();ctx.arc(0,s*0.05,s*0.05,0,7);ctx.fill();
    ctx.restore();
  },
  heal(cx,cy,s,t){
    ctx.save();ctx.translate(cx,cy);
    // Üvegtest
    ctx.fillStyle='rgba(200,230,255,0.25)';
    ctx.beginPath();
    ctx.moveTo(-s*0.07,-s*0.28);ctx.lineTo(-s*0.07,-s*0.12);
    ctx.bezierCurveTo(-s*0.3,-s*0.02,-s*0.3,s*0.35,0,s*0.4);
    ctx.bezierCurveTo(s*0.3,s*0.35,s*0.3,-s*0.02,s*0.07,-s*0.12);
    ctx.lineTo(s*0.07,-s*0.28);ctx.closePath();ctx.fill();
    // Piros folyadék + bugyborék
    const lv=Math.sin(t*0.08)*s*0.015;
    ctx.fillStyle='#d02838';
    ctx.beginPath();
    ctx.moveTo(-s*0.2,s*0.06+lv);
    ctx.bezierCurveTo(-s*0.26,s*0.2,-s*0.2,s*0.34,0,s*0.37);
    ctx.bezierCurveTo(s*0.2,s*0.34,s*0.26,s*0.2,s*0.2,s*0.06-lv);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,120,130,0.7)';
    ctx.beginPath();ctx.arc(-s*0.06,s*0.18+lv*2,s*0.03,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(s*0.08,s*0.25,s*0.02,0,7);ctx.fill();
    // Üvegkörvonal
    ctx.strokeStyle='rgba(230,240,255,0.7)';ctx.lineWidth=1.2;
    ctx.beginPath();
    ctx.moveTo(-s*0.07,-s*0.28);ctx.lineTo(-s*0.07,-s*0.12);
    ctx.bezierCurveTo(-s*0.3,-s*0.02,-s*0.3,s*0.35,0,s*0.4);
    ctx.bezierCurveTo(s*0.3,s*0.35,s*0.3,-s*0.02,s*0.07,-s*0.12);
    ctx.lineTo(s*0.07,-s*0.28);ctx.stroke();
    // Dugó
    ctx.fillStyle='#8a6030';
    ctx.fillRect(-s*0.08,-s*0.38,s*0.16,s*0.11);
    // Csillanás
    ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=1.4;
    ctx.beginPath();ctx.arc(-s*0.1,s*0.1,s*0.16,Math.PI*0.9,Math.PI*1.3);ctx.stroke();
    ctx.restore();
  },
  maxheal(cx,cy,s,t){
    ctx.save();ctx.translate(cx,cy);
    const beat=1+0.06*Math.sin(t*0.15);
    ctx.scale(beat,beat);
    // Arany szív
    const hg=ctx.createRadialGradient(0,-s*0.05,s*0.05,0,0,s*0.4);
    hg.addColorStop(0,'#ffd870');hg.addColorStop(1,'#d09010');
    ctx.fillStyle=hg;
    ctx.beginPath();
    ctx.moveTo(0,s*0.32);
    ctx.bezierCurveTo(-s*0.42,s*0.02,-s*0.32,-s*0.34,0,-s*0.12);
    ctx.bezierCurveTo(s*0.32,-s*0.34,s*0.42,s*0.02,0,s*0.32);
    ctx.fill();
    ctx.strokeStyle='#a87010';ctx.lineWidth=1.4;ctx.stroke();
    // Kereszt középen
    ctx.strokeStyle='#fff8e0';ctx.lineWidth=s*0.055;
    ctx.beginPath();ctx.moveTo(0,-s*0.1);ctx.lineTo(0,s*0.14);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-s*0.1,0.01);ctx.lineTo(s*0.1,0.01);ctx.stroke();
    ctx.restore();
  },
  atk_up(cx,cy,s,t){
    ITEM_DRAW._scroll(cx,cy,s,'#c03030');
    // Villám rúna
    ctx.strokeStyle='#e04040';ctx.lineWidth=s*0.05;ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(cx+s*0.05,cy-s*0.16);ctx.lineTo(cx-s*0.06,cy+0.01);
    ctx.lineTo(cx+s*0.03,cy+0.01);ctx.lineTo(cx-s*0.05,cy+s*0.17);
    ctx.stroke();
  },
  def_up(cx,cy,s,t){
    ITEM_DRAW._scroll(cx,cy,s,'#3060c0');

    ctx.strokeStyle='#4878d8';ctx.lineWidth=s*0.045;
    ctx.beginPath();
    ctx.moveTo(cx,cy-s*0.15);ctx.lineTo(cx+s*0.1,cy-s*0.09);
    ctx.lineTo(cx+s*0.09,cy+s*0.05);ctx.quadraticCurveTo(cx+s*0.05,cy+s*0.14,cx,cy+s*0.17);
    ctx.quadraticCurveTo(cx-s*0.05,cy+s*0.14,cx-s*0.09,cy+s*0.05);
    ctx.lineTo(cx-s*0.1,cy-s*0.09);ctx.closePath();ctx.stroke();
  },
  _scroll(cx,cy,s,ribbonCol){
    ctx.save();ctx.translate(cx,cy);
    // Pergamen
    ctx.fillStyle='#e0cc9a';
    ctx.fillRect(-s*0.24,-s*0.3,s*0.48,s*0.6);
    ctx.strokeStyle='#a8946a';ctx.lineWidth=1;
    ctx.strokeRect(-s*0.24,-s*0.3,s*0.48,s*0.6);
    // Felső-alsó tekercsrudak
    ctx.fillStyle='#c8b078';
    ctx.beginPath();ctx.ellipse(0,-s*0.3,s*0.27,s*0.055,0,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(0,s*0.3,s*0.27,s*0.055,0,0,7);ctx.fill();
    ctx.strokeStyle='#8a7a50';ctx.stroke();
    // Szalag
    ctx.fillStyle=ribbonCol;
    ctx.fillRect(-s*0.26,s*0.06,s*0.09,s*0.16);
    ctx.restore();
  },
  fireball(cx,cy,s,t){
    ctx.save();ctx.translate(cx,cy);
    // Lángoló gömb
    const flick=0.85+0.15*Math.sin(t*0.3);
    const fg=ctx.createRadialGradient(0,0,s*0.05,0,0,s*0.38*flick);
    fg.addColorStop(0,'#fff0a0');fg.addColorStop(0.4,'#ff9020');fg.addColorStop(1,'rgba(200,40,10,0)');
    ctx.fillStyle=fg;
    ctx.beginPath();ctx.arc(0,0,s*0.42,0,7);ctx.fill();
    // Mag
    ctx.fillStyle='#ffb838';
    ctx.beginPath();ctx.arc(0,0,s*0.19,0,7);ctx.fill();
    // Lángnyelvek
    ctx.fillStyle=`rgba(255,120,20,${0.8*flick})`;
    for(let i=0;i<5;i++){
      const a=i*1.256+t*0.05;
      const fx2=Math.cos(a)*s*0.24,fy2=Math.sin(a)*s*0.24;
      ctx.beginPath();
      ctx.moveTo(fx2,fy2);
      ctx.quadraticCurveTo(fx2*1.8,fy2*1.8-s*0.1,fx2*1.4,fy2*1.4-s*0.22);
      ctx.quadraticCurveTo(fx2*1.2,fy2*1.2,fx2*0.6,fy2*0.6);
      ctx.fill();
    }
    ctx.restore();
  },
};
// Ikon rajzoló ritkaság-ragyogással
function drawItemIcon(it,cx,cy,size,t){
  const R=it.R;
  // Ragyogás a ritkaság színével
  const glow=ctx.createRadialGradient(cx,cy,1,cx,cy,size*0.65);
  const pulse=it.rarity==='legendary'?0.35+0.2*Math.sin(t*0.1):0.25;
  glow.addColorStop(0,R.border+Math.round(pulse*255).toString(16).padStart(2,'0'));
  glow.addColorStop(1,'transparent');
  ctx.fillStyle=glow;
  ctx.fillRect(cx-size*0.65,cy-size*0.65,size*1.3,size*1.3);
  const fn=ITEM_DRAW[it.subtype];
  if(fn)fn(cx,cy,size,t);
  else ftxt(it.glyph||'?',cx,cy+size*0.2,itemCol(it),size*0.6,'center',MONO);
}

function makeMon(key,x,y,diff){
  const t=MONS[key];const d=DIFF[diff];
  return{key,x,y,rx:x,ry:y,name:t.name,seed:Math.random()*100,facing:pick([-1,1]),
    maxHp:Math.round(t.hp*d.monHp),hp:Math.round(t.hp*d.monHp),
    atk:Math.round(t.atk*d.monAtk),def:t.def,xp:t.xp,
    sp:t.sp||null,boss:!!t.boss,alive:true};
}
function spawnMons(rooms,level,diff){
  const pool=POOL[level]||['goblin'];const mons=[];
  for(let i=1;i<rooms.length-1;i++){
    const room=rooms[i];
    const cnt=rnd(1,2+Math.floor(level/2));
    for(let j=0;j<cnt;j++)mons.push(makeMon(pick(pool),rnd(room.x+1,room.x+room.w-2),rnd(room.y+1,room.y+room.h-2),diff));
    if(level>=2&&Math.random()<0.28)
      mons.push(makeMon(pick(['vampire','spider','golem','witch','assassin']),rnd(room.x+1,room.x+room.w-2),rnd(room.y+1,room.y+room.h-2),diff));
  }
  const[bx,by]=rooms[rooms.length-1].center();
  mons.push(makeMon(BOSS_LVL[level],bx,by,diff));
  return mons;
}
function spawnChests(rooms,lvl){

      const r=rooms[i];
      chests.push({x:rnd(r.x+1,r.x+r.w-2),y:rnd(r.y+1,r.y+r.h-2),opened:false,items:[randItem(lvl),randItem(lvl)]});

  }
  return chests;
}

// ══════════ FX (projectiles, flashes) ══════════
let fx=[];
function addFx(o){fx.push({...o,t0:performance.now()});}
function drawFx(camX,camY){
  const now=performance.now();
  fx=fx.filter(f=>now-f.t0<f.dur);
  for(const f of fx){
    const p=(now-f.t0)/f.dur;
    if(f.type==='arrow'||f.type==='ball'){
      const x=(f.x0+(f.x1-f.x0)*p-camX)*TILE+TILE/2;
      const y=(f.y0+(f.y1-f.y0)*p-camY)*TILE+TILE/2;
      if(f.type==='arrow'){
        const ang=Math.atan2(f.y1-f.y0,f.x1-f.x0);
        ctx.save();ctx.translate(x,y);ctx.rotate(ang);
        ctx.strokeStyle='#d4a84b';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(6,0);ctx.stroke();
        ctx.fillStyle='#e8e0c8';
        ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(3,-3);ctx.lineTo(3,3);ctx.closePath();ctx.fill();
        ctx.restore();
      }else{
        // cannonball with fire trail
        ctx.fillStyle='#282828';
        ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();
        ctx.fillStyle=`rgba(255,140,20,${0.8*(1-p)})`;
        ctx.beginPath();ctx.arc(x-(f.x1-f.x0)*3,y-(f.y1-f.y0)*3,3.5,0,7);ctx.fill();
      }
    }else if(f.type==='slash'){
      const x=(f.x-camX)*TILE+TILE/2,y=(f.y-camY)*TILE+TILE/2;
      ctx.save();ctx.translate(x,y);ctx.rotate(-0.6+p*1.4);
      ctx.strokeStyle=`rgba(240,240,255,${0.9*(1-p)})`;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(0,0,TILE*0.55,-0.5,0.7);ctx.stroke();
      ctx.restore();
    }else if(f.type==='boom'){
      const x=(f.x-camX)*TILE+TILE/2,y=(f.y-camY)*TILE+TILE/2;
      const r=TILE*(0.3+p*0.9);
      ctx.strokeStyle=`rgba(255,${160-p*100|0},20,${0.9*(1-p)})`;
      ctx.lineWidth=4*(1-p)+1;
      ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();
    }else if(f.type==='dmgnum'){
      const x=(f.x-camX)*TILE+TILE/2,y=(f.y-camY)*TILE-p*22;
      ftxt(f.txt,x,y,f.col||'#ff6050',13*(1-p*0.3),'center',MONO);
    }
  }
}

// ══════════ DEKORÁCIÓK (amfora, pókháló, repedés...) ══════════
function spawnDecor(tiles,rooms){
  const decor=[];const used=new Set();
  const place=(x,y,type)=>{const k=`${x},${y}`;if(used.has(k))return;used.add(k);decor.push({x,y,type,seed:Math.random()*100});};
  const isWall=(x,y)=>x<0||x>=MAP_W||y<0||y>=MAP_H||tiles[x][y]===T.WALL;
  for(const r of rooms){
    // Pókháló a sarkokban (padlócsempe, két fal mellett)
    const corners=[[r.x,r.y],[r.x+r.w-1,r.y],[r.x,r.y+r.h-1],[r.x+r.w-1,r.y+r.h-1]];
    for(const[cx,cy]of corners){
      if(tiles[cx]&&tiles[cx][cy]===T.FLOOR&&Math.random()<0.35)place(cx,cy,'web');
    }
    // Amfora / hordó a fal mellett
    if(Math.random()<0.4){
      const side=pick([[r.x,rnd(r.y+1,r.y+r.h-2)],[r.x+r.w-1,rnd(r.y+1,r.y+r.h-2)],[rnd(r.x+1,r.x+r.w-2),r.y],[rnd(r.x+1,r.x+r.w-2),r.y+r.h-1]]);
      if(tiles[side[0]]&&tiles[side[0]][side[1]]===T.FLOOR)place(side[0],side[1],pick(['amphora','barrel']));
    }
    // Padló-szórvány: csont, koponya, törmelék, moha, tócsa
    const n=rnd(0,3);
    for(let i=0;i<n;i++){
      const dx2=rnd(r.x+1,r.x+r.w-2),dy2=rnd(r.y+1,r.y+r.h-2);
      if(tiles[dx2][dy2]===T.FLOOR)place(dx2,dy2,pick(['bones','skull','rubble','moss','puddle']));
    }
  }
  // Repedések a látható falakon (padló melletti falcsempék)
  for(let x=1;x<MAP_W-1;x++)for(let y=1;y<MAP_H-1;y++){
    if(tiles[x][y]!==T.WALL)continue;
    const nearFloor=tiles[x+1][y]===T.FLOOR||tiles[x-1][y]===T.FLOOR||tiles[x][y+1]===T.FLOOR||tiles[x][y-1]===T.FLOOR;
    if(nearFloor&&Math.random()<0.06)place(x,y,'crack');
  }
  return decor;
}
const DECOR_DRAW={
  amphora(px,py,s,seed){
    const cx=px+s/2,base=py+s*0.85;
    // Terrakotta test
    ctx.fillStyle='#a05828';
    ctx.beginPath();
    ctx.moveTo(cx-s*0.16,base);
    ctx.bezierCurveTo(cx-s*0.30,base-s*0.28,cx-s*0.22,base-s*0.50,cx-s*0.09,base-s*0.55);
    ctx.lineTo(cx-s*0.10,base-s*0.64);ctx.lineTo(cx+s*0.10,base-s*0.64);ctx.lineTo(cx+s*0.09,base-s*0.55);
    ctx.bezierCurveTo(cx+s*0.22,base-s*0.50,cx+s*0.30,base-s*0.28,cx+s*0.16,base);
    ctx.closePath();ctx.fill();
    // Perem és fülek
    ctx.strokeStyle='#7a3c18';ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(cx-s*0.13,base-s*0.62);ctx.lineTo(cx+s*0.13,base-s*0.62);ctx.stroke();
    ctx.beginPath();ctx.arc(cx-s*0.20,base-s*0.48,s*0.08,Math.PI*0.4,Math.PI*1.4);ctx.stroke();
    ctx.beginPath();ctx.arc(cx+s*0.20,base-s*0.48,s*0.08,Math.PI*1.6,Math.PI*0.6);ctx.stroke();
    // Görög minta csík
    ctx.strokeStyle='#d4a84b';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx-s*0.22,base-s*0.32);ctx.lineTo(cx+s*0.22,base-s*0.32);ctx.stroke();
  },
  barrel(px,py,s,seed){
    const cx=px+s/2,cy=py+s*0.55;
    ctx.fillStyle='#6a4520';
    ctx.beginPath();ctx.ellipse(cx,cy,s*0.26,s*0.34,0,0,7);ctx.fill();
    ctx.strokeStyle='#3a2410';ctx.lineWidth=1.6;
    ctx.beginPath();ctx.ellipse(cx,cy,s*0.26,s*0.34,0,0,7);ctx.stroke();
    // Abroncsok
    ctx.strokeStyle='#8a8078';ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(cx-s*0.25,cy-s*0.14);ctx.lineTo(cx+s*0.25,cy-s*0.14);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-s*0.25,cy+s*0.14);ctx.lineTo(cx+s*0.25,cy+s*0.14);ctx.stroke();
    // Dongák
    ctx.strokeStyle='#523618';ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(cx,cy-s*0.33);ctx.lineTo(cx,cy+s*0.33);ctx.stroke();
  },
  web(px,py,s,seed){
    // Sarok-pókháló: melyik sarok? seed dönt
    const corner=Math.floor(rndSeed(seed)*4);
    const ox=corner%2===0?px:px+s, oy=corner<2?py:py+s;
    const sx2=corner%2===0?1:-1, sy2=corner<2?1:-1;
    ctx.strokeStyle='rgba(220,220,230,0.4)';ctx.lineWidth=0.7;
    // Sugárszálak
    for(let i=0;i<=4;i++){
      const ang=(i/4)*Math.PI/2;
      ctx.beginPath();ctx.moveTo(ox,oy);
      ctx.lineTo(ox+sx2*Math.cos(ang)*s*0.7,oy+sy2*Math.sin(ang)*s*0.7);ctx.stroke();
    }
    // Ívek
    for(let r2=0.25;r2<=0.62;r2+=0.18){
      ctx.beginPath();
      for(let i=0;i<=4;i++){
        const ang=(i/4)*Math.PI/2;
        const wx=ox+sx2*Math.cos(ang)*s*r2,wy=oy+sy2*Math.sin(ang)*s*r2;
        i===0?ctx.moveTo(wx,wy):ctx.lineTo(wx,wy);
      }
      ctx.stroke();
    }
  },
  crack(px,py,s,seed){
    // Cikkcakkos repedés a falon
    ctx.strokeStyle='rgba(10,8,6,0.8)';ctx.lineWidth=1.3;
    let x=px+s*(0.3+rndSeed(seed)*0.4),y=py+s*0.08;
    ctx.beginPath();ctx.moveTo(x,y);
    for(let i=0;i<4;i++){
      x+=(rndSeed(seed+i*3)-0.5)*s*0.4;
      y+=s*0.22;
      ctx.lineTo(x,y);
    }
    ctx.stroke();
    // Kis mellékrepedés
    ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(px+s*0.5,py+s*0.4);
    ctx.lineTo(px+s*0.5+(rndSeed(seed+9)-0.5)*s*0.5,py+s*0.55);ctx.stroke();
  },
  bones(px,py,s,seed){
    const cx=px+s/2,cy=py+s*0.6;
    ctx.strokeStyle='#d8d0b8';ctx.lineWidth=2;
    ctx.save();ctx.translate(cx,cy);ctx.rotate(rndSeed(seed)*3);
    ctx.beginPath();ctx.moveTo(-s*0.2,0);ctx.lineTo(s*0.2,0);ctx.stroke();
    ctx.fillStyle='#d8d0b8';
    for(const ex of[-s*0.2,s*0.2]){
      ctx.beginPath();ctx.arc(ex,-s*0.045,s*0.05,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(ex,s*0.045,s*0.05,0,7);ctx.fill();
    }
    ctx.restore();
  },
  skull(px,py,s,seed){
    const cx=px+s/2,cy=py+s*0.55;
    ctx.fillStyle='#d0c8b0';
    ctx.beginPath();ctx.arc(cx,cy,s*0.14,0,7);ctx.fill();
    ctx.fillRect(cx-s*0.09,cy+s*0.06,s*0.18,s*0.09);
    ctx.fillStyle='#181410';
    ctx.beginPath();ctx.arc(cx-s*0.05,cy-s*0.02,s*0.04,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(cx+s*0.05,cy-s*0.02,s*0.04,0,7);ctx.fill();
  },
  rubble(px,py,s,seed){
    ctx.fillStyle='#5a5048';
    for(let i=0;i<4;i++){
      const rx=px+s*(0.2+rndSeed(seed+i)*0.6);
      const ry=py+s*(0.4+rndSeed(seed+i*7)*0.4);
      const rr2=s*(0.04+rndSeed(seed+i*13)*0.06);
      ctx.beginPath();ctx.arc(rx,ry,rr2,0,7);ctx.fill();
    }
  },
  moss(px,py,s,seed){
    ctx.fillStyle='rgba(60,110,40,0.5)';
    for(let i=0;i<3;i++){
      const mx=px+s*rndSeed(seed+i*5);
      const my=py+s*(0.6+rndSeed(seed+i*11)*0.35);
      ctx.beginPath();ctx.ellipse(mx,my,s*0.14,s*0.07,rndSeed(seed+i)*3,0,7);ctx.fill();
    }
  },
  puddle(px,py,s,seed){
    ctx.fillStyle='rgba(20,30,50,0.55)';
    ctx.beginPath();ctx.ellipse(px+s/2,py+s*0.6,s*0.3,s*0.17,0,0,7);ctx.fill();
    ctx.strokeStyle='rgba(120,150,200,0.25)';ctx.lineWidth=0.8;
    ctx.beginPath();ctx.ellipse(px+s/2,py+s*0.6,s*0.22,s*0.11,0,0,7);ctx.stroke();
  },
};

// ══════════ WORLD ══════════
// ══════════ BIZTOSÍTÉK: SOSE LEHESSEN BEZÁRÓDNI ══════════
// A kezdőpontból (4 irányban lépve) minden padlónak, a lépcsőnek és minden ládának elérhetőnek kell lennie.
// Ahol nem az, oda folyosót vájunk; a ládák soha nem zárhatnak el utat (azokat máshová tesszük).
function reachMap(tiles,sx,sy,block){
  const seen=Array.from({length:MAP_W},()=>new Uint8Array(MAP_H));
  const q=[[sx,sy]];seen[sx][sy]=1;
  while(q.length){
    const[x,y]=q.pop();
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=MAP_W||ny>=MAP_H||seen[nx][ny]||tiles[nx][ny]===T.WALL)continue;
      if(block&&block.has(nx+','+ny))continue;
      seen[nx][ny]=1;q.push([nx,ny]);
    }
  }
  return seen;
}
function carveTo(tiles,x0,y0,x1,y1){
  for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++)if(tiles[x][y0]===T.WALL)tiles[x][y0]=T.FLOOR;
  for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)if(tiles[x1][y]===T.WALL)tiles[x1][y]=T.FLOOR;
}
function ensureOpen(tiles,rooms,chests){
  const[sx,sy]=rooms[0].center();
  // 1. minden padló (és a lépcső) összefüggő legyen: ami leszakadt, azt folyosóval bekötjük
  for(let guard=0;guard<200;guard++){
    const seen=reachMap(tiles,sx,sy,null);
    let lost=null;
    for(let x=0;x<MAP_W&&!lost;x++)for(let y=0;y<MAP_H;y++)if(tiles[x][y]!==T.WALL&&!seen[x][y]){lost=[x,y];break;}
    if(!lost)break;
    carveTo(tiles,lost[0],lost[1],sx,sy);
  }
  // 2. a ládák ne zárjanak el semmit: ha egy láda nélkül több minden érhető el, mint vele, áttesszük
  const all=reachMap(tiles,sx,sy,null);
  let total=0;for(let x=0;x<MAP_W;x++)for(let y=0;y<MAP_H;y++)if(all[x][y])total++;
  const key=c=>c.x+','+c.y;
  // jó az elrendezés, ha a ládák mögött semmi nem marad el (csak maguk a ládák nem járhatók),
  // és minden ládához oda lehet lépni
  const fine=block=>{
    const seen=reachMap(tiles,sx,sy,block);
    let n=0;for(let x=0;x<MAP_W;x++)for(let y=0;y<MAP_H;y++)if(seen[x][y])n++;
    return n+block.size>=total&&chests.every(o=>o.opened||!block.has(key(o))||hasOpenSide(tiles,o,seen));
  };
  for(const c of chests){
    if(c.opened)continue;
    const block=new Set(chests.filter(o=>!o.opened).map(key));
    const onStairOrStart=tiles[c.x][c.y]===T.STAIR||(c.x===sx&&c.y===sy);
    if(!onStairOrStart&&fine(block))continue;
    // áthelyezés egy olyan szobabeli helyre, ahol nem zár el semmit
    let moved=false;
    for(let tries=0;tries<80&&!moved;tries++){
      const r=rooms[rnd(1,rooms.length-1)];
      const nx=rnd(r.x+1,r.x+r.w-2),ny=rnd(r.y+1,r.y+r.h-2);
      if(tiles[nx][ny]!==T.FLOOR||chests.some(o=>o!==c&&!o.opened&&o.x===nx&&o.y===ny))continue;
      const b2=new Set(block);b2.delete(key(c));b2.add(nx+','+ny);
      const ox=c.x,oy=c.y;c.x=nx;c.y=ny;
      if(fine(b2))moved=true;else{c.x=ox;c.y=oy;}
    }
    if(!moved)c.opened=true;   // végső esetben a láda eltűnik, de az út szabad marad
  }
}
function hasOpenSide(tiles,c,seen){
  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const x=c.x+dx,y=c.y+dy;if(x>=0&&y>=0&&x<MAP_W&&y<MAP_H&&seen[x][y])return true;}
  return false;
}

function createWorld(player,dl,diff){
  const{tiles,rooms}=generateMap(dl);
  const mons=spawnMons(rooms,dl,diff);
  const chests=spawnChests(rooms,dl);
  ensureOpen(tiles,rooms,chests);
  const decor=spawnDecor(tiles,rooms);
  const[sx,sy]=rooms[0].center();
  player.x=sx;player.y=sy;player.rx=sx;player.ry=sy;
  const vis=computeFOV(tiles,player.x,player.y);
  vis.forEach(k=>player.explored.add(k));
  fx=[];
  return{tiles,rooms,mons,chests,decor,vis,dungeonLevel:dl,diff,turn:0,player};
}
function updateFOV(w){w.vis=computeFOV(w.tiles,w.player.x,w.player.y);w.vis.forEach(k=>w.player.explored.add(k));}
function monAt(w,x,y){return w.mons.find(m=>m.alive&&m.x===x&&m.y===y)||null;}
function chestAt(w,x,y){return w.chests.find(c=>!c.opened&&c.x===x&&c.y===y)||null;}
function blocked(w,x,y){return x<0||x>=MAP_W||y<0||y>=MAP_H||w.tiles[x][y]===T.WALL;}
function calcDmg(atk,def){return Math.max(1,atk+rnd(-2,3)-def);}

function monSpecial(m,w){
  const p=w.player;
  if(m.sp==='lifesteal'){const h=Math.max(1,Math.floor(m.atk*0.4));m.hp=Math.min(m.maxHp,m.hp+h);p.addMsg(`${m.name} vért szív (+${h})`,P.vein);}
  else if(m.sp==='poison'&&Math.random()<0.38){p.poison=Math.max(p.poison,4);p.addMsg('Megmérgeztek!','#90c030');}
  else if(m.sp==='regen'&&Math.random()<0.28){m.hp=Math.min(m.maxHp,m.hp+Math.floor(m.maxHp*0.05));}
  else if(m.sp==='crit'&&Math.random()<0.3){const x=Math.floor(m.atk*0.9);p.hp-=x;p.addMsg(`KRITIKUS! -${x}`,P.vein);}
  else if(m.sp==='fireball'&&Math.random()<0.22){const d=rnd(12,20);p.hp-=d;p.addMsg(`Tűzgömb! -${d}`,'#e06020');addFx({type:'boom',x:p.x,y:p.y,dur:400});}
  else if(m.sp==='aoe'&&Math.random()<0.18){const d=rnd(8,16);p.hp-=d;p.addMsg(`Robbanás! -${d}`,'#e08020');addFx({type:'boom',x:p.x,y:p.y,dur:400});}
  else if(m.sp==='summon'&&Math.random()<0.18){const pool=POOL[w.dungeonLevel]||['goblin'];w.mons.push(makeMon(pick(pool),m.x+rnd(-2,2),m.y+rnd(-2,2),w.diff));p.addMsg(`${m.name} idéz!`,P.vein);}
  else if(m.sp==='teleport'&&Math.random()<0.22){const r=pick(w.rooms);const[rx,ry]=r.center();m.x=rx;m.y=ry;m.rx=rx;m.ry=ry;p.addMsg(`${m.name} teleportál!`,'#9060d0');}
  else if(m.sp==='revive'&&m.hp<m.maxHp*0.3&&Math.random()<0.15){
    const dead=w.mons.filter(mm=>!mm.alive&&!mm.boss);
    if(dead.length){const rev=pick(dead);rev.alive=true;rev.hp=Math.floor(rev.maxHp*0.4);p.addMsg(`${m.name} feltámaszt!`,'#9060d0');}
  }
}
function monAttack(m,w){
  const p=w.player;const dmg=calcDmg(m.atk,p.def);
  p.hp-=dmg;p.addMsg(`${m.name}: -${dmg}`,P.vein);
  addFx({type:'dmgnum',x:p.x,y:p.y,txt:`-${dmg}`,col:'#ff5040',dur:700});
  sfxGrowl();sfxHit();
  monSpecial(m,w);
  if(p.hp<=0){
    p.lives--;
    if(p.lives>0){p.hp=Math.floor(p.maxHp*0.5);p.addMsg(`💔 Elestél! ${p.lives} élet maradt.`,P.vein);sfxDeath();}
    else{p.hp=0;p.alive=false;sfxDeath();}
  }
}
function pAttack(p,m,w){
  let dmg=calcDmg(p.atk,m.def);
  if(p.cls==='Íjász'&&Math.random()<0.28){dmg=Math.floor(dmg*2.2);p.addMsg('🏹 Kritikus!',P.parchGold);}
  m.hp-=dmg;
  addFx({type:'slash',x:m.x,y:m.y,dur:250});
  addFx({type:'dmgnum',x:m.x,y:m.y,txt:`-${dmg}`,col:'#ffd060',dur:700});
  sfxSword();
  // Lunge animation
  p.lunge=1;p.lungeDx=m.x-p.x;p.lungeDy=m.y-p.y;
  if(m.hp<=0){
    m.alive=false;p.gainXP(m.xp,DIFF[w.diff].xpMult);
    p.addMsg(`${m.name} elesett! +${m.xp}xp`,P.parchGold);
    if(m.boss)p.addMsg('⚜ BOSS LEGYŐZVE!',P.legendary);
  }else{p.addMsg(`${m.name}: -${dmg}`,'#e0a040');sfxGrowl();}
}
// Ranged: shoot the first monster in a straight line within weapon range
function tryRangedAttack(w,dx,dy){
  const p=w.player;const wep=p.weapon;
  if(!wep||!wep.range||wep.range<2)return false;
  for(let d=1;d<=wep.range;d++){
    const tx=p.x+dx*d,ty=p.y+dy*d;
    if(blocked(w,tx,ty))return false; // wall blocks the shot
    const m=monAt(w,tx,ty);
    if(m){
      if(d===1)return false; // adjacent: melee instead
      let dmg=calcDmg(p.atk,m.def);
      if(p.cls==='Íjász'&&Math.random()<0.28){dmg=Math.floor(dmg*2.2);p.addMsg('🏹 Kritikus!',P.parchGold);}
      m.hp-=dmg;
      const isCannon=wep.subtype==='cannon';
      addFx({type:isCannon?'ball':'arrow',x0:p.x,y0:p.y,x1:m.x,y1:m.y,dur:isCannon?300:200});
      addFx({type:'dmgnum',x:m.x,y:m.y,txt:`-${dmg}`,col:'#ffd060',dur:700});
      if(isCannon){sfxCannon();addFx({type:'boom',x:m.x,y:m.y,dur:350});}
      else sfxShoot();
      if(m.hp<=0){
        m.alive=false;p.gainXP(m.xp,DIFF[w.diff].xpMult);
        p.addMsg(`${m.name} elesett! +${m.xp}xp`,P.parchGold);
        if(m.boss)p.addMsg('⚜ BOSS LEGYŐZVE!',P.legendary);
      }else{p.addMsg(`Lövés: ${m.name} -${dmg}`,'#e0a040');sfxGrowl();}
      advanceTurn(w);
      return true;
    }
  }
  return false;
}
function advanceTurn(w){
  w.turn++;
  const{player:p,mons,vis}=w;
  if(p.poison>0){p.poison--;const d=rnd(2,5);p.hp=Math.max(1,p.hp-d);p.addMsg(p.poison?`☠ Méreg -${d}`:'Méreg lejárt','#90c030');}
  for(const m of mons){
    if(!m.alive)continue;
    if(!p.explored.has(`${m.x},${m.y}`))continue;
    if(vis.has(`${m.x},${m.y}`)){
      const dx=p.x===m.x?0:p.x>m.x?1:-1;
      const dy=p.y===m.y?0:p.y>m.y?1:-1;
      if(dx!==0)m.facing=dx;
      const nx=m.x+dx,ny=m.y+dy;
      if(nx===p.x&&ny===p.y)monAttack(m,w);
      else if(!blocked(w,nx,ny)&&!monAt(w,nx,ny)){m.x=nx;m.y=ny;}
    }else if(Math.random()<0.22){
      const d=pick([[1,0],[-1,0],[0,1],[0,-1]]);
      if(d[0]!==0)m.facing=d[0];
      const nx=m.x+d[0],ny=m.y+d[1];
      if(!blocked(w,nx,ny)&&!monAt(w,nx,ny)){m.x=nx;m.y=ny;}
    }
  }
}
function doMove(w,dx,dy){
  const p=w.player;
  if(dx!==0)p.facing=dx; // arcirány követi a mozgást
  // Ranged first (if weapon has range and target further than 1)
  if(tryRangedAttack(w,dx,dy))return true;
  const nx=p.x+dx,ny=p.y+dy;
  const m=monAt(w,nx,ny);
  if(m){pAttack(p,m,w);advanceTurn(w);return true;}
  const ch=chestAt(w,nx,ny);
  if(ch){sfxChest();chestUI={chest:ch,sel:0};setState('chest');return true;}
  if(!blocked(w,nx,ny)){
    p.x=nx;p.y=ny;updateFOV(w);sfxStep();advanceTurn(w);return true;
  }
  return false;
}
function doUseItem(w,item){
  const p=w.player;
  const rem=()=>p.inventory.splice(p.inventory.indexOf(item),1);
  if(item.subtype==='heal'){const h=Math.min(item.heal,p.maxHp-p.hp);p.hp+=h;p.addMsg(`+${h} HP`,'#40c860');rem();}
  else if(item.subtype==='maxheal'){p.maxHp+=item.maxHpUp;p.hp=Math.min(p.hp+item.heal,p.maxHp);p.addMsg(`MaxHP +${item.maxHpUp}!`,'#40c860');rem();}
  else if(item.subtype==='fireball'){let c=0;for(const m of w.mons){if(!m.alive||!w.vis.has(`${m.x},${m.y}`))continue;const d=item.damage+rnd(0,15);m.hp-=d;addFx({type:'boom',x:m.x,y:m.y,dur:400});if(m.hp<=0){m.alive=false;p.gainXP(m.xp,DIFF[w.diff].xpMult);}c++;}p.addMsg(`🔥 Tűzgömb! ${c} szörny`,'#e06020');sfxCannon();rem();}
  else if(item.subtype==='atk_up'){const up=p.cls==='Mágus'?item.atkUp*2:item.atkUp;p.baseAtk+=up;p.addMsg(`ATK +${up} örökre!`,'#e05050');rem();}
  else if(item.subtype==='def_up'){const up=p.cls==='Lovag'?item.defUp+2:item.defUp;p.baseDef+=up;p.addMsg(`DEF +${up} örökre!`,'#5080e0');rem();}
  else if(item.slot==='weapon'){if(p.weapon)p.inventory.push(p.weapon);p.weapon=item;rem();p.addMsg(`Felvéve: ${item.label}`,'#a0c8e0');}
  else if(item.slot==='armor'){if(p.armor)p.inventory.push(p.armor);p.armor=item;rem();p.addMsg(`Felvéve: ${item.label}`,'#8090c0');}
}

// ══════════ STATE ══════════
let gameState='menu';
let world=null,player=null;
let charSel=0,diffSel=1,chestUI=null,tick=0;
const HUD_H=IS_MOBILE?86:96;
function setState(s){
  gameState=s;
  // Controls only visible during gameplay
  const inGame=(s==='play'||s==='inv'||s==='chest');
  document.getElementById('dpad').style.display=(inGame&&IS_MOBILE)?'block':'none';
  document.getElementById('abtns').style.display=(inGame&&IS_MOBILE)?'flex':'none';
}
setState('menu');
function startGame(cls,diff){
  player=createPlayer(cls);
  world=createWorld(player,1,diff);
  player.addMsg('Kaland kezdete! ♥♥♥',P.parchGold);
  setState('play');
}
function nextLevel(){
  const n=world.dungeonLevel+1;
  if(n>MAX_LEVEL){setState('win');return;}
  player.addMsg(`${n}. mélység...`,'#9060d0');
  world=createWorld(player,n,world.diff);
}
function pickChestItem(){
  if(!chestUI)return;
  const{chest,sel}=chestUI;
  const it=chest.items[sel];chest.opened=true;
  if(it.slot==='weapon'&&!player.weapon)player.weapon=it;
  else if(it.slot==='armor'&&!player.armor)player.armor=it;
  else player.inventory.push(it);
  player.addMsg(`Elveszed: ${it.label}`,it.R.glow);
  chestUI=null;setState('play');
}

// ══════════ TORCHES ══════════
const TORCHES=[];
function seedTorches(rooms){
  TORCHES.length=0;
  for(const r of rooms){
    if(Math.random()<0.55)TORCHES.push({x:r.x+1,y:r.y+1,ph:Math.random()*7});
    if(Math.random()<0.35)TORCHES.push({x:r.x+r.w-2,y:r.y+r.h-2,ph:Math.random()*7});
  }
}

// ══════════ RENDER WORLD ══════════
function drawWorldScene(){
  const{tiles,mons,chests,vis,player:p,rooms}=world;
  if(!world._ts){seedTorches(rooms);world._ts=true;}

  // Smooth time-based movement lerp (frame-rate independent, fluid)
  const lerpK=1-Math.pow(0.0001,dt/1000); // ~fast exponential smoothing
  p.rx+=(p.x-p.rx)*lerpK;p.ry+=(p.y-p.ry)*lerpK;
  if(Math.abs(p.x-p.rx)<0.005)p.rx=p.x;
  if(Math.abs(p.y-p.ry)<0.005)p.ry=p.y;
  for(const m of mons){
    if(!m.alive)continue;
    m.rx+=(m.x-m.rx)*lerpK*0.8;m.ry+=(m.y-m.ry)*lerpK*0.8;
  }
  if(p.lunge>0)p.lunge=Math.max(0,p.lunge-dt*0.008);

  const gH=H-HUD_H;
  const camW=Math.ceil(W/TILE)+2,camH=Math.ceil(gH/TILE)+2;
  const camX=clamp(p.rx-camW/2,0,Math.max(0,MAP_W-camW));
  const camY=clamp(p.ry-camH/2,0,Math.max(0,MAP_H-camH));

  ctx.fillStyle='#080604';ctx.fillRect(0,0,W,gH);

  const heat=new Map();
  for(const tor of TORCHES){
    const fl=0.7+0.3*Math.sin(tick*0.06+tor.ph);
    for(let dx=-3;dx<=3;dx++)for(let dy=-3;dy<=3;dy++){
      const d=Math.sqrt(dx*dx+dy*dy);if(d>3.5)continue;
      const k=`${tor.x+dx},${tor.y+dy}`;
      heat.set(k,(heat.get(k)||0)+fl*(1-d/3.5)*0.8);
    }
  }

  const cX0=Math.floor(camX),cY0=Math.floor(camY);
  for(let sx=-1;sx<camW+1;sx++){
    for(let sy=-1;sy<camH+1;sy++){
      const tx=cX0+sx,ty=cY0+sy;
      if(tx<0||tx>=MAP_W||ty<0||ty>=MAP_H)continue;
      const tt=tiles[tx][ty];
      const isVis=vis.has(`${tx},${ty}`),isExp=p.explored.has(`${tx},${ty}`);
      if(!isExp)continue;
      const px=(tx-camX)*TILE,py=(ty-camY)*TILE;
      if(tt===T.WALL){
        ctx.fillStyle=isVis?'#2e2218':'#16120e';ctx.fillRect(px,py,TILE+1,TILE+1);
        if(isVis){
          ctx.strokeStyle='#3c2e1c';ctx.lineWidth=0.6;
          ctx.beginPath();ctx.moveTo(px,py+TILE*0.45);ctx.lineTo(px+TILE,py+TILE*0.45);ctx.stroke();
          ctx.beginPath();ctx.moveTo(px+TILE*0.5,py);ctx.lineTo(px+TILE*0.5,py+TILE*0.45);ctx.stroke();
          ctx.beginPath();ctx.moveTo(px+TILE*0.25,py+TILE*0.45);ctx.lineTo(px+TILE*0.25,py+TILE);ctx.stroke();
          ctx.beginPath();ctx.moveTo(px+TILE*0.75,py+TILE*0.45);ctx.lineTo(px+TILE*0.75,py+TILE);ctx.stroke();
        }
      }else if(tt===T.FLOOR){
        ctx.fillStyle=isVis?'#1c1610':'#0e0c08';ctx.fillRect(px,py,TILE+1,TILE+1);
        if(isVis){
          const th=heat.get(`${tx},${ty}`)||0;
          if(th>0){ctx.fillStyle=`rgba(190,95,10,${Math.min(0.25,th*0.16)})`;ctx.fillRect(px,py,TILE+1,TILE+1);}
          ctx.strokeStyle='#28201a';ctx.lineWidth=0.5;
          ctx.strokeRect(px+0.5,py+0.5,TILE-1,TILE-1);
        }
      }else if(tt===T.STAIR){
        ctx.fillStyle=isVis?'#2a2050':'#14102a';ctx.fillRect(px,py,TILE+1,TILE+1);
        if(isVis){
          ctx.strokeStyle='#8070d0';ctx.lineWidth=1.5;
          ctx.beginPath();ctx.arc(px+TILE/2,py+TILE/2,TILE/3.2,0,Math.PI*1.5);ctx.stroke();
          ftxt('▼',px+TILE/2,py+TILE/2+6,'#c0b0ff',TILE*0.5,'center',MONO);
        }
      }
    }
  }

  // Dekorációk (amfora, pókháló, repedés, csontok...)
  for(const d of world.decor){
    const key=`${d.x},${d.y}`;
    const isVis=vis.has(key),isExp=p.explored.has(key);
    if(!isExp)continue;
    const sx=(d.x-camX)*TILE,sy=(d.y-camY)*TILE;
    if(sx<-TILE||sx>W||sy<-TILE||sy>gH)continue;
    ctx.globalAlpha=isVis?1:0.35;
    const fn=DECOR_DRAW[d.type];
    if(fn)fn(sx,sy,TILE,d.seed);
    ctx.globalAlpha=1;
  }

  // Torches
  for(const tor of TORCHES){
    if(!vis.has(`${tor.x},${tor.y}`))continue;
    const sx=(tor.x-camX)*TILE,sy=(tor.y-camY)*TILE;
    if(sx<-TILE*2||sx>W+TILE||sy<-TILE*2||sy>gH+TILE)continue;
    const fl=0.6+0.4*Math.sin(tick*0.07+tor.ph);
    const g=ctx.createRadialGradient(sx+TILE/2,sy+TILE/2,1,sx+TILE/2,sy+TILE/2,TILE*1.4);
    g.addColorStop(0,`rgba(245,150,25,${0.65*fl})`);g.addColorStop(1,'rgba(200,80,0,0)');
    ctx.fillStyle=g;ctx.fillRect(sx-TILE/2,sy-TILE/2,TILE*2,TILE*2);
    ctx.strokeStyle='#5a3a10';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(sx+TILE/2,sy+TILE*0.7);ctx.lineTo(sx+TILE/2,sy+TILE*0.4);ctx.stroke();
    ctx.fillStyle=`rgba(255,${170+50*fl|0},40,${0.85+0.15*fl})`;
    ctx.beginPath();ctx.ellipse(sx+TILE/2,sy+TILE*0.32,3,5+2*fl,0,0,7);ctx.fill();
  }

  // Chests
  for(const ch of chests){
    if(ch.opened||!vis.has(`${ch.x},${ch.y}`))continue;
    const sx=(ch.x-camX)*TILE,sy=(ch.y-camY)*TILE;
    if(sx<-TILE||sx>W||sy<-TILE||sy>gH)continue;
    const gp=0.15+0.15*Math.sin(tick*0.08);
    const cg=ctx.createRadialGradient(sx+TILE/2,sy+TILE/2,1,sx+TILE/2,sy+TILE/2,TILE);
    cg.addColorStop(0,`rgba(220,160,0,${gp})`);cg.addColorStop(1,'transparent');
    ctx.fillStyle=cg;ctx.fillRect(sx,sy,TILE,TILE);
    ctx.fillStyle='#4a2c10';rrect(sx+TILE*0.15,sy+TILE*0.35,TILE*0.7,TILE*0.45,3);ctx.fill();
    ctx.fillStyle='#5a3818';rrect(sx+TILE*0.12,sy+TILE*0.22,TILE*0.76,TILE*0.2,3);ctx.fill();
    ctx.strokeStyle=P.parchGold;ctx.lineWidth=1.5;
    rrect(sx+TILE*0.12,sy+TILE*0.22,TILE*0.76,TILE*0.58,3);ctx.stroke();
    ctx.fillStyle=P.parchGold;
    ctx.beginPath();ctx.arc(sx+TILE/2,sy+TILE*0.48,TILE*0.08,0,7);ctx.fill();
  }

  // Monsters (drawn sprites!)
  for(const m of mons){
    if(!m.alive||!vis.has(`${m.x},${m.y}`))continue;
    const sx=(m.rx-camX)*TILE,sy=(m.ry-camY)*TILE;
    if(sx<-TILE*2||sx>W+TILE||sy<-TILE*2||sy>gH+TILE)continue;
    if(m.boss){
      const bg=ctx.createRadialGradient(sx+TILE/2,sy+TILE/2,2,sx+TILE/2,sy+TILE/2,TILE*1.5);
      const pl=0.2+0.2*Math.sin(tick*0.05);
      bg.addColorStop(0,`rgba(255,200,40,${pl})`);bg.addColorStop(1,'transparent');
      ctx.fillStyle=bg;ctx.fillRect(sx-TILE/2,sy-TILE/2,TILE*2,TILE*2);
    }
    const drawFn=MON_DRAW[m.key];
    if(drawFn){
      ctx.save();
      if(m.facing<0){ctx.translate((sx+TILE/2)*2,0);ctx.scale(-1,1);}
      drawFn(sx+TILE/2,sy+TILE/2,TILE*0.85,tick,m.seed);
      ctx.restore();
    }
    // HP bar
    const bw=TILE-6,hw=Math.max(1,Math.floor(bw*m.hp/m.maxHp));
    ctx.fillStyle='#3a0808';ctx.fillRect(sx+3,sy-3,bw,3.5);
    ctx.fillStyle=m.boss?P.legendary:'#c83028';ctx.fillRect(sx+3,sy-3,hw,3.5);
  }

  // Player (lerped + lunge)
  const lox=p.lunge*p.lungeDx*TILE*0.3;
  const loy=p.lunge*p.lungeDy*TILE*0.3;
  const px2=(p.rx-camX)*TILE+lox,py2=(p.ry-camY)*TILE+loy;
  const pg=ctx.createRadialGradient(px2+TILE/2,py2+TILE/2,1,px2+TILE/2,py2+TILE/2,TILE);
  pg.addColorStop(0,p.col+'40');pg.addColorStop(1,'transparent');
  ctx.fillStyle=pg;ctx.fillRect(px2-TILE*0.3,py2-TILE*0.3,TILE*1.6,TILE*1.6);
  ctx.save();
  if(p.facing<0){ctx.translate((px2+TILE/2)*2,0);ctx.scale(-1,1);}
  CLASS_SPRITES[p.cls](px2+TILE/2,py2+TILE/2,TILE*0.72,tick);
  ctx.restore();
  if(p.poison>0){ctx.globalAlpha=0.2+0.12*Math.sin(tick*0.15);ctx.fillStyle='#60c020';ctx.fillRect(px2,py2,TILE,TILE);ctx.globalAlpha=1;}

  // FX layer
  drawFx(camX,camY);
}

    ftxt(`XP ${p.xp}/${p.xpNext}`,12,y0+35,'#c0c0e0',8,'left',MONO);
    ftxt('♥'.repeat(p.lives)+'♡'.repeat(3-p.lives),10,y0+58,P.vein,15);
    const c2=210;
    ftxt(`${p.cls}  ·  Lv.${p.plvl}`,c2,y0+22,P.parchGold,12);
    ftxt(`⚔ ${p.atk}    🛡 ${p.def}`,c2,y0+42,P.ink,11);
    ftxt(`Mélység ${world.dungeonLevel}/${MAX_LEVEL} · ${DIFF[world.diff].label} · Kör ${world.turn}`,c2,y0+62,P.inkDark,10);
    const c3=470;
    ftxt(`⚔ ${p.weapon?p.weapon.label:'Puszta kéz'}`,c3,y0+22,p.weapon?p.weapon.R.border:P.inkDark,10);
    ftxt(`🛡 ${p.armor?p.armor.label:'Nincs páncél'}`,c3,y0+40,p.armor?p.armor.R.border:P.inkDark,10);
    ftxt(`WASD · I:Táska · ${keyLabel(BINDS.stair)}:Lépcső`,c3,y0+60,P.inkDark,9);
    const mx=Math.max(c3+230,W*0.62);
    const mw=W-mx-8;
    if(mw>100){
      const msgs=p.msgs.slice(-4);
      for(let i=0;i<msgs.length;i++){
        const a=0.4+0.6*(i/(msgs.length-1||1));
        ctx.globalAlpha=a;
        ctx.save();ctx.beginPath();ctx.rect(mx,y0,mw,HUD_H);ctx.clip();
        ftxt(msgs[i].t,mx,y0+16+i*19,msgs[i].c,10);
        ctx.restore();ctx.globalAlpha=1;
      }
    }
  }
}

// ══════════ MENU BACKGROUND (cover art style) ══════════
let _menuBgCache=null,_menuBgW=0,_menuBgH=0;

function rndSeedM(n){const x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x);}

function menuRrect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

function drawMenuStaticBG(cw,ch){
  // Dark gradient base
  const g=ctx.createLinearGradient(0,0,0,ch);
  g.addColorStop(0,'#0a0806');g.addColorStop(.45,'#191207');g.addColorStop(1,'#080604');
  ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);
  // Brick wall
  const k=Math.min(cw,ch)/600;
  const bh=44*k,bw=96*k;
  const floorY=ch*0.78;
  for(let row=0,y=-bh;y<floorY+bh;row++,y+=bh){
    const off=(row%2)*bw/2;
    for(let x=-bw;x<cw+bw;x+=bw){
      const sd=row*31+Math.round(x/bw);
      const v=rndSeedM(sd*1.7);
      ctx.fillStyle=`rgb(${(28+v*18)|0},${(21+v*12)|0},${(14+v*8)|0})`;
      menuRrect(x+off+2*k,y+2*k,bw-4*k,bh-4*k,3*k);ctx.fill();
      ctx.fillStyle=`rgba(255,220,170,${0.025+v*0.025})`;
      menuRrect(x+off+2*k,y+2*k,bw-4*k,3*k,1*k);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.22)';
      menuRrect(x+off+2*k,y+bh-6*k,bw-4*k,3*k,1*k);ctx.fill();
    }
  }
  // Floor
  const fg=ctx.createLinearGradient(0,floorY,0,ch);
  fg.addColorStop(0,'#1b140d');fg.addColorStop(1,'#080605');
  ctx.fillStyle=fg;ctx.fillRect(0,floorY,cw,ch-floorY);
  ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=1.2*k;
  let y2=floorY,st=7*k;
  while(y2<ch){ctx.beginPath();ctx.moveTo(0,y2);ctx.lineTo(cw,y2);ctx.stroke();st*=1.28;y2+=st;}
  const vpY=floorY-180*k;
  for(let i=-16;i<=16;i++){
    const xt=cw/2+i*36*k;
    const tt=(ch-vpY)/(floorY-vpY);
    ctx.beginPath();ctx.moveTo(xt,floorY);ctx.lineTo(cw/2+(xt-cw/2)*tt,ch);ctx.stroke();
  }
  ctx.fillStyle='rgba(0,0,0,.32)';ctx.fillRect(0,floorY,cw,7*k);
  // Arch interior
  const archW=Math.min(cw*0.52,420*k);
  const archR=archW/2;
  const archSpring=floorY-archW*0.52;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cw/2-archR,floorY);ctx.lineTo(cw/2-archR,archSpring);
  ctx.arc(cw/2,archSpring,archR,Math.PI,0);
  ctx.lineTo(cw/2+archR,floorY);ctx.closePath();
  ctx.clip();
  const ig=ctx.createLinearGradient(0,archSpring-archR,0,floorY);
  ig.addColorStop(0,'#080510');ig.addColorStop(.5,'#12081a');ig.addColorStop(1,'#050308');
  ctx.fillStyle=ig;ctx.fillRect(cw/2-archR,archSpring-archR,archR*2,floorY-archSpring+archR);
  const pg2=ctx.createRadialGradient(cw/2,archSpring+archR*0.35,4,cw/2,archSpring+archR*0.35,archR*1.4);
  pg2.addColorStop(0,'rgba(110,45,155,.32)');pg2.addColorStop(1,'rgba(40,10,70,0)');
  ctx.fillStyle=pg2;ctx.fillRect(cw/2-archR,archSpring-archR,archR*2,floorY-archSpring+archR);
  ctx.restore();
  // Arch stone ring
  const th=26*k;
  ctx.save();
  ctx.beginPath();
  const ro=archR+th;
  ctx.moveTo(cw/2-ro,floorY);ctx.lineTo(cw/2-ro,archSpring);
  ctx.arc(cw/2,archSpring,ro,Math.PI,0);ctx.lineTo(cw/2+ro,floorY);ctx.closePath();
  ctx.moveTo(cw/2-archR,floorY);ctx.lineTo(cw/2+archR,floorY);ctx.lineTo(cw/2+archR,archSpring);
  ctx.arc(cw/2,archSpring,archR,0,Math.PI,true);ctx.lineTo(cw/2-archR,floorY);ctx.closePath();
  const sg=ctx.createLinearGradient(cw/2-ro,0,cw/2+ro,0);
  sg.addColorStop(0,'#262018');sg.addColorStop(.5,'#453a28');sg.addColorStop(1,'#262018');
  ctx.fillStyle=sg;ctx.fill('evenodd');
  ctx.restore();
  ctx.strokeStyle='rgba(8,5,3,.7)';ctx.lineWidth=1.6*k;
  for(let i=0;i<=10;i++){
    const ang=Math.PI+i*(Math.PI/10);
    ctx.beginPath();
    ctx.moveTo(cw/2+archR*Math.cos(ang),archSpring+archR*Math.sin(ang));
    ctx.lineTo(cw/2+ro*Math.cos(ang),archSpring+ro*Math.sin(ang));ctx.stroke();
  }
  ctx.fillStyle='#d4a84b';
  ctx.beginPath();ctx.arc(cw/2,archSpring-ro-4*k,7*k,0,7);ctx.fill();
  ctx.strokeStyle='#d4a84b';ctx.lineWidth=1.6*k;
  ctx.beginPath();ctx.arc(cw/2,archSpring,archR+th*0.5,Math.PI,0);ctx.stroke();
  // Film grain noise
  const nz=document.createElement('canvas');nz.width=nz.height=160;
  const nc=nz.getContext('2d'),id=nc.createImageData(160,160);
  for(let i=0;i<id.data.length;i+=4){const v=(Math.random()*255)|0;
    id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=14;}
  nc.putImageData(id,0,0);
  const pat=ctx.createPattern(nz,'repeat');
  ctx.globalAlpha=.45;ctx.fillStyle=pat;ctx.fillRect(0,0,cw,ch);ctx.globalAlpha=1;
}

function drawMenuTorch(x,y,k,t,ph){
  const fl=0.65+0.35*Math.sin(t*0.09+ph)+0.1*Math.sin(t*0.29+ph*2);
  // Glow halo
  const g=ctx.createRadialGradient(x,y,3*k,x,y,200*k);
  g.addColorStop(0,`rgba(255,160,50,${0.38*fl})`);
  g.addColorStop(.4,`rgba(200,90,15,${0.16*fl})`);
  g.addColorStop(1,'rgba(120,40,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,200*k,0,7);ctx.fill();
  // Sconce bracket
  ctx.fillStyle='#2b2118';menuRrect(x-9*k,y+7*k,18*k,42*k,3*k);ctx.fill();
  ctx.strokeStyle='#4a3a24';ctx.lineWidth=1.6*k;menuRrect(x-9*k,y+7*k,18*k,42*k,3*k);ctx.stroke();
  ctx.fillStyle='#3a2c1c';
  ctx.beginPath();ctx.moveTo(x-16*k,y+3*k);ctx.lineTo(x+16*k,y+3*k);
  ctx.lineTo(x+10*k,y+14*k);ctx.lineTo(x-10*k,y+14*k);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#6a5230';ctx.lineWidth=1.6*k;ctx.stroke();
  // Flame layers
  for(let i=0;i<3;i++){
    const fh=(36+i*13)*k*fl,fw=(12-i*2.6)*k;
    ctx.fillStyle=['rgba(200,55,8,.82)','rgba(255,140,22,.92)','rgba(255,235,160,.96)'][i];
    ctx.beginPath();ctx.moveTo(x-fw,y+2*k);
    ctx.quadraticCurveTo(x-fw*1.4+Math.sin(t*0.13+i)*4*k,y-fh*0.5,x+Math.sin(t*0.1+i)*3*k,y-fh);
    ctx.quadraticCurveTo(x+fw*1.4+Math.sin(t*0.11+i)*4*k,y-fh*0.5,x+fw,y+2*k);
    ctx.closePath();ctx.fill();
  }
}

function drawMenuDragon(cx,cy,sz,t){
  const s=sz/30;ctx.save();ctx.translate(cx,cy);
  const flap=Math.sin(t*0.045)*0.10;
  for(const dir of[-1,1]){
    ctx.save();ctx.scale(dir,1);ctx.rotate(-flap);
    const wg=ctx.createLinearGradient(3*s,-8*s,26*s,4*s);
    wg.addColorStop(0,'#6b0d12');wg.addColorStop(1,'#25050a');
    ctx.fillStyle=wg;
    ctx.beginPath();ctx.moveTo(3*s,-7*s);
    ctx.quadraticCurveTo(15*s,-24*s,26*s,-16*s);
    ctx.quadraticCurveTo(23*s,-8*s,28*s,-1*s);
    ctx.quadraticCurveTo(20*s,-3*s,18*s,4*s);
    ctx.quadraticCurveTo(12*s,-0.5*s,10*s,8*s);
    ctx.quadraticCurveTo(7*s,2*s,3*s,4*s);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#8c1c18';ctx.lineWidth=1.1*s;ctx.lineCap='round';
    for(const p of[[26*s,-16*s],[28*s,-1*s],[18*s,4*s],[10*s,8*s]]){
      ctx.beginPath();ctx.moveTo(3*s,-7*s);ctx.lineTo(p[0],p[1]);ctx.stroke();}
    ctx.restore();
  }
  // Tail
  ctx.fillStyle='#7d1113';
  ctx.beginPath();ctx.moveTo(-4*s,9*s);ctx.quadraticCurveTo(-20*s,17*s,-27*s,9*s);
  ctx.quadraticCurveTo(-17*s,22*s,-2*s,15*s);ctx.closePath();ctx.fill();
  // Body
  const bgd=ctx.createLinearGradient(-9*s,-4*s,9*s,16*s);
  bgd.addColorStop(0,'#d42a22');bgd.addColorStop(.55,'#a4131a');bgd.addColorStop(1,'#5c070e');
  ctx.fillStyle=bgd;ctx.beginPath();ctx.ellipse(0,6*s,9.4*s,11.4*s,0,0,7);ctx.fill();
  // Belly
  ctx.fillStyle='#e2ac48';ctx.beginPath();ctx.ellipse(0,8*s,5*s,8*s,0,0,7);ctx.fill();
  ctx.strokeStyle='rgba(120,70,10,.5)';ctx.lineWidth=0.9*s;
  for(let i=0;i<5;i++){ctx.beginPath();
    ctx.moveTo(-4.4*s,2*s+i*3.1*s);ctx.quadraticCurveTo(0,4*s+i*3.1*s,4.4*s,2*s+i*3.1*s);ctx.stroke();}
  // Scale texture
  ctx.strokeStyle='rgba(60,4,8,.4)';ctx.lineWidth=0.8*s;
  for(let r=0;r<4;r++)for(let c=-2;c<=2;c++){
    ctx.beginPath();ctx.arc(c*3.4*s-(r%2?1.7*s:0),1*s+r*3.3*s,1.6*s,Math.PI*1.05,Math.PI*1.95);ctx.stroke();}
  // Arms
  ctx.fillStyle='#8f1216';
  for(const d of[-1,1]){ctx.save();ctx.scale(d,1);
    ctx.beginPath();ctx.ellipse(9*s,11*s,3.1*s,5.6*s,-0.35,0,7);ctx.fill();
    ctx.strokeStyle='#efe3c2';ctx.lineWidth=0.9*s;
    for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(9.5*s+i*1.4*s,15*s);
      ctx.lineTo(10.6*s+i*2*s,18.4*s);ctx.stroke();}
    ctx.restore();}
  // Neck
  ctx.fillStyle='#bf1e1e';
  ctx.beginPath();ctx.moveTo(-6.4*s,1*s);ctx.quadraticCurveTo(-5.4*s,-10*s,-4.8*s,-14*s);
  ctx.lineTo(4.8*s,-14*s);ctx.quadraticCurveTo(5.4*s,-10*s,6.4*s,1*s);ctx.closePath();ctx.fill();
  ctx.fillStyle='#e2ac48';
  for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(0,-3*s-i*3*s,2.6*s,1.1*s,0,0,7);ctx.fill();}
  // Back spines
  ctx.fillStyle='#4e0a10';
  for(let i=0;i<5;i++){const sy=-15*s+i*4*s;
    ctx.beginPath();ctx.moveTo(-4.6*s-i*0.5*s,sy);ctx.lineTo(-8.4*s-i*0.9*s,sy-2.4*s);
    ctx.lineTo(-4.6*s-i*0.5*s,sy+2.4*s);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(4.6*s+i*0.5*s,sy);ctx.lineTo(8.4*s+i*0.9*s,sy-2.4*s);
    ctx.lineTo(4.6*s+i*0.5*s,sy+2.4*s);ctx.closePath();ctx.fill();}
  // Head
  const hg=ctx.createLinearGradient(0,-24*s,0,-12*s);
  hg.addColorStop(0,'#e03028');hg.addColorStop(1,'#8f1216');
  ctx.fillStyle=hg;ctx.beginPath();ctx.ellipse(0,-18.5*s,6.4*s,5.6*s,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-13.6*s,4.3*s,3.6*s,0,0,7);ctx.fill();
  // Brow ridges
  ctx.fillStyle='#6d0c11';
  ctx.beginPath();ctx.moveTo(-6.2*s,-21.4*s);ctx.lineTo(-1.2*s,-19.8*s);
  ctx.lineTo(-6.2*s,-18.6*s);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(6.2*s,-21.4*s);ctx.lineTo(1.2*s,-19.8*s);
  ctx.lineTo(6.2*s,-18.6*s);ctx.closePath();ctx.fill();
  // Open jaw + glow
  ctx.fillStyle='#280405';ctx.beginPath();ctx.ellipse(0,-11.6*s,3.5*s,2.1*s,0,0,7);ctx.fill();
  const th2=0.6+0.4*Math.sin(t*0.14);
  const tg=ctx.createRadialGradient(0,-11.6*s,0.4*s,0,-11.6*s,4.2*s);
  tg.addColorStop(0,`rgba(255,235,160,${th2})`);tg.addColorStop(.5,`rgba(255,130,18,${0.6*th2})`);
  tg.addColorStop(1,'rgba(200,40,0,0)');
  ctx.fillStyle=tg;ctx.beginPath();ctx.ellipse(0,-11.6*s,4.2*s,2.8*s,0,0,7);ctx.fill();
  // Teeth
  ctx.fillStyle='#f3ead0';
  for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*1.4*s-0.5*s,-13*s);
    ctx.lineTo(i*1.4*s+0.5*s,-13*s);ctx.lineTo(i*1.4*s,-11.4*s);ctx.closePath();ctx.fill();}
  // Horns
  ctx.strokeStyle='#eadfb8';ctx.lineWidth=1.8*s;ctx.lineCap='round';
  for(const d of[-1,1]){
    ctx.beginPath();ctx.moveTo(d*4*s,-22.4*s);ctx.quadraticCurveTo(d*9.5*s,-26.5*s,d*8*s,-32*s);ctx.stroke();
    ctx.beginPath();ctx.moveTo(d*5.6*s,-20*s);ctx.quadraticCurveTo(d*10.5*s,-20.5*s,d*12*s,-24.5*s);ctx.stroke();}
  // Eyes glow
  const eg=0.72+0.28*Math.sin(t*0.11);
  for(const d of[-1,1]){
    const g2=ctx.createRadialGradient(d*2.4*s,-19.4*s,0.2*s,d*2.4*s,-19.4*s,3.4*s);
    g2.addColorStop(0,`rgba(255,255,180,${eg})`);g2.addColorStop(.4,`rgba(255,195,35,${0.8*eg})`);
    g2.addColorStop(1,'rgba(255,110,0,0)');
    ctx.fillStyle=g2;ctx.beginPath();ctx.arc(d*2.4*s,-19.4*s,3.4*s,0,7);ctx.fill();
    ctx.fillStyle='#fff6c0';ctx.beginPath();ctx.ellipse(d*2.4*s,-19.4*s,1.4*s,1.0*s,0,0,7);ctx.fill();
    ctx.fillStyle='#2a0a00';ctx.beginPath();ctx.ellipse(d*2.4*s,-19.4*s,0.4*s,1.0*s,0,0,7);ctx.fill();}
  ctx.restore();
}

function drawMenuFire(cx,cy,s,t){
  ctx.save();ctx.translate(cx,cy);
  const p=0.5+0.5*Math.sin(t*0.05);
  const L=22*s*(0.85+0.22*p);
  const g=ctx.createLinearGradient(0,0,0,L);
  g.addColorStop(0,'rgba(255,242,180,.94)');g.addColorStop(.22,'rgba(255,162,28,.82)');
  g.addColorStop(.62,'rgba(220,60,8,.4)');g.addColorStop(1,'rgba(130,18,0,0)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(-1.4*s,0);
  ctx.quadraticCurveTo(-8*s,L*0.5,-6.5*s,L);
  ctx.quadraticCurveTo(0,L*1.05,6.5*s,L);
  ctx.quadraticCurveTo(8*s,L*0.5,1.4*s,0);ctx.closePath();ctx.fill();
  for(let i=0;i<18;i++){
    const q=((t*0.012+rndSeedM(i*3.3))%1);
    const y=q*L,sp=(rndSeedM(i*7.7)-0.5)*q*10*s;
    const r=(2.2-q*1.4)*s*(0.5+rndSeedM(i*5.1));
    ctx.fillStyle=`rgba(255,${(215-q*130)|0},${(55-q*45)|0},${0.7*(1-q)})`;
    ctx.beginPath();ctx.arc(sp,y,Math.max(0.5,r),0,7);ctx.fill();}
  ctx.restore();
}

function menuCrossedSwords(cx,cy,sz,col){
  ctx.save();ctx.translate(cx,cy);
  for(const d of[-1,1]){ctx.save();ctx.rotate(d*0.62);
    ctx.fillStyle=col;
    ctx.beginPath();ctx.moveTo(0,-sz*0.52);ctx.lineTo(sz*0.055,-sz*0.38);
    ctx.lineTo(sz*0.055,sz*0.10);ctx.lineTo(-sz*0.055,sz*0.10);
    ctx.lineTo(-sz*0.055,-sz*0.38);ctx.closePath();ctx.fill();
    ctx.fillRect(-sz*0.20,sz*0.10,sz*0.40,sz*0.065);
    ctx.fillRect(-sz*0.045,sz*0.165,sz*0.09,sz*0.20);
    ctx.beginPath();ctx.arc(0,sz*0.38,sz*0.065,0,7);ctx.fill();
    ctx.restore();}
  ctx.restore();
}

function menuOrnament(x,y,w,col,k){
  ctx.strokeStyle=col;ctx.lineWidth=1.4*k;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.stroke();
  ctx.fillStyle=col;
  ctx.beginPath();ctx.arc(x,y,2.8*k,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(x+w,y,2.8*k,0,7);ctx.fill();
}

function menuLsText(s,x,y,col,sz,sp,al){
  ctx.font=`900 ${sz}px ${SERIF}`;
  let tot=0;for(const c of s){tot+=ctx.measureText(c).width+sp;}tot-=sp;
  let sx=al==='center'?x-tot/2:x;
  ctx.fillStyle=col;ctx.textAlign='left';
  for(const c of s){ctx.fillText(c,sx,y);sx+=ctx.measureText(c).width+sp;}
}

function menuFlourish(x,y,w,col,k,flip){
  ctx.save();ctx.translate(x,y);if(flip)ctx.scale(-1,1);
  ctx.strokeStyle=col;ctx.lineWidth=1.6*k;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(w*0.5,-w*0.13,w,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(w*0.18,0);ctx.quadraticCurveTo(w*0.36,w*0.15,w*0.56,0.02);ctx.stroke();
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,3*k,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(w,-4*k);ctx.lineTo(w+8*k,0);ctx.lineTo(w,4*k);ctx.closePath();ctx.fill();
  ctx.restore();
}

// ══════════ SCREENS ══════════
function drawMenu(){
  const k=Math.min(W,H)/600;
  const floorY=H*0.78;
  const archW=Math.min(W*0.52,420*k);
  const archR=archW/2;
  const archSpring=floorY-archW*0.52;

  // ── Static background (cached) ──
  if(!_menuBgCache||_menuBgW!==W||_menuBgH!==H){
    _menuBgCache=document.createElement('canvas');
    _menuBgCache.width=W;_menuBgCache.height=H;
    const m=ctx;ctx=_menuBgCache.getContext('2d');
    drawMenuStaticBG(W,H);ctx=m;
    _menuBgW=W;_menuBgH=H;
  }
  ctx.drawImage(_menuBgCache,0,0);

  // ── Dragon inside arch ──
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(W/2-archR,floorY);ctx.lineTo(W/2-archR,archSpring);
  ctx.arc(W/2,archSpring,archR,Math.PI,0);
  ctx.lineTo(W/2+archR,floorY);ctx.closePath();
  ctx.clip();
  const dSz=Math.min(archR*1.85,350*k);
  const dCy=archSpring+archR*0.62;
  // Dragon glow
  const dg=ctx.createRadialGradient(W/2,dCy-dSz*0.3,8,W/2,dCy-dSz*0.3,dSz*1.2);
  dg.addColorStop(0,'rgba(180,45,18,.32)');dg.addColorStop(1,'rgba(80,8,8,0)');
  ctx.fillStyle=dg;ctx.fillRect(W/2-archR,archSpring-archR,archR*2,floorY-archSpring+archR);
  drawMenuDragon(W/2,dCy,dSz,tick);
  drawMenuFire(W/2,dCy-(11.4*(dSz/30)),dSz/30,tick);
  ctx.restore();

  // ── Torches ──
  const torchX=[W*0.18,W*0.82];
  const torchY=H*0.36;
  drawMenuTorch(torchX[0],torchY,k,tick,0);
  drawMenuTorch(torchX[1],torchY,k,tick,2.4);

  // Floor glow pools under torches
  for(const tx of torchX){
    const pg=ctx.createRadialGradient(tx,floorY+50*k,3,tx,floorY+50*k,180*k);
    pg.addColorStop(0,'rgba(200,100,20,.18)');pg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=pg;ctx.beginPath();ctx.ellipse(tx,floorY+50*k,180*k,70*k,0,0,7);ctx.fill();
  }

  // ── Heroes ──
  const spread=W*0.22;
  const feetY=H*0.88;
  const heroGlow=(x,glow,size)=>{
    const gg=ctx.createRadialGradient(x,feetY-size*0.42,5,x,feetY-size*0.42,size*0.9);
    gg.addColorStop(0,glow+'28');gg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(x,feetY-size*0.42,size*0.9,0,7);ctx.fill();
    const sh=ctx.createRadialGradient(x,feetY+4*k,2,x,feetY+4*k,size*0.45);
    sh.addColorStop(0,'rgba(0,0,0,.7)');sh.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=sh;ctx.beginPath();ctx.ellipse(x,feetY+6*k,size*0.44,size*0.10,0,0,7);ctx.fill();
  };
  const mSize=Math.min(110*k,H*0.2),kSize=Math.min(135*k,H*0.24);
  // Mage (left)
  heroGlow(W/2-spread,'#c070f0',mSize);
  drawMage(W/2-spread,feetY-mSize*0.44,mSize,tick);
  // Archer (right, mirrored)
  heroGlow(W/2+spread,'#70d860',mSize);
  ctx.save();ctx.translate(W/2+spread,0);ctx.scale(-1,1);ctx.translate(-(W/2+spread),0);
  drawArcher(W/2+spread,feetY-mSize*0.44,mSize,tick);
  ctx.restore();
  // Knight (centre, biggest)
  heroGlow(W/2,'#70c8e8',kSize);
  drawKnight(W/2,feetY-kSize*0.44,kSize,tick);

  // ── Embers ──
  for(let i=0;i<55;i++){
    const sp=0.18+rndSeedM(i*3.7)*0.65;
    const ex=(rndSeedM(i*1.31)*W+Math.sin(tick*0.02+i)*26*k+W)%W;
    const ey=H-((tick*0.85*sp+rndSeedM(i*7.1)*H)%(H*1.03));
    const al=0.08+0.4*Math.abs(Math.sin(tick*0.05+i));
    const er=(0.7+rndSeedM(i*5.5)*2.2)*k;
    ctx.fillStyle=`rgba(255,${(145+rndSeedM(i)*85)|0},45,${al*0.8})`;
    ctx.beginPath();ctx.arc(ex,ey,er,0,7);ctx.fill();
  }

  // ── Vignette ──
  const vg=ctx.createRadialGradient(W/2,H*0.5,Math.min(W,H)*0.15,W/2,H*0.5,Math.max(W,H)*0.8);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(.6,'rgba(0,0,0,.38)');
  vg.addColorStop(1,'rgba(0,0,0,.90)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  // ── Title banner ──
  const bw=Math.min(W*0.88,580*k),bh=Math.min(168*k,H*0.24);
  const bx=(W-bw)/2,by=H*0.042;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.88)';ctx.shadowBlur=36*k;ctx.shadowOffsetY=10*k;
  const bg2=ctx.createLinearGradient(0,by,0,by+bh);
  bg2.addColorStop(0,'#33250f');bg2.addColorStop(.5,'#231a0b');bg2.addColorStop(1,'#150f06');
  ctx.fillStyle=bg2;menuRrect(bx,by,bw,bh,12*k);ctx.fill();
  ctx.restore();
  ctx.strokeStyle='#d4a84b';ctx.lineWidth=2.8*k;menuRrect(bx,by,bw,bh,12*k);ctx.stroke();
  ctx.strokeStyle='rgba(212,168,75,.3)';ctx.lineWidth=1.2*k;
  menuRrect(bx+8*k,by+8*k,bw-16*k,bh-16*k,9*k);ctx.stroke();
  menuOrnament(bx+26*k,by+22*k,bw-52*k,'#8a6a2e',k);

  // Title lettering
  const title='KARD ÉS MÁGIA';
  let tsz=Math.min(48*k,bw/10);
  ctx.font=`900 ${tsz}px ${SERIF}`;
  let tot=0;for(const c of title)tot+=ctx.measureText(c).width+tsz*0.055;
  while(tot>bw-200*k&&tsz>14){tsz-=1;ctx.font=`900 ${tsz}px ${SERIF}`;tot=0;for(const c of title)tot+=ctx.measureText(c).width+tsz*0.055;}
  const ty=by+bh*0.60;
  // Shadow
  ctx.save();ctx.shadowColor='rgba(255,160,35,.5)';ctx.shadowBlur=28*k;
  menuLsText(title,W/2,ty,'#1a1005',tsz,tsz*0.055,'center');
  ctx.restore();
  // Gold gradient fill
  const tg2=ctx.createLinearGradient(0,ty-tsz*0.85,0,ty+tsz*0.18);
  tg2.addColorStop(0,'#ffeaa8');tg2.addColorStop(.42,'#e9b944');
  tg2.addColorStop(.62,'#b7801d');tg2.addColorStop(1,'#f4d178');
  menuLsText(title,W/2,ty-1*k,tg2,tsz,tsz*0.055,'center');
  // Crossed swords flanking title
  const halfT=tot/2;
  menuCrossedSwords(W/2-halfT-40*k,ty-tsz*0.28,tsz*0.78,'#c8a03a');
  menuCrossedSwords(W/2+halfT+40*k,ty-tsz*0.28,tsz*0.78,'#c8a03a');
  // Subtitle
  const sub='ROGUELIKE KALAND  ·  5 MÉLYSÉG  ·  3 HŐS';
  ftxt(sub,W/2,by+bh*0.84,'#9c8354',Math.min(16*k,tsz*0.28),'center');
  menuOrnament(bx+26*k,by+bh-20*k,bw-52*k,'#6a5222',k);

  // ── Buttons ──
  const btnW=Math.min(300*k,W-56),btnH=Math.min(54*k,H*0.085);
  const btnStartY=H*0.50;
  const btns=[
    {t:'⚔  Kaland kezdete',c:P.parchGold,bg:'#2e2210',bd:P.parchGold,fn:()=>{diffSel=1;setState('diff');}},
    {t:'Irányítás',c:P.ink,bg:'#241a0c',bd:P.parchEdge,fn:()=>{setState('help');}},
  ];
  for(let i=0;i<btns.length;i++){
    const bx2=(W-btnW)/2,by2=btnStartY+i*(btnH+14*k);
    // Button glow
    ctx.save();ctx.shadowColor=i===0?'rgba(212,168,75,.45)':'rgba(0,0,0,0)';ctx.shadowBlur=18*k;
    panel(bx2,by2,btnW,btnH,btns[i].bg,btns[i].bd,2,8);
    ctx.restore();
    ftxt(btns[i].t,W/2,by2+btnH*0.62,btns[i].c,Math.min(17*k,17),'center');
    addHit(bx2,by2,btnW,btnH,btns[i].fn);
  }

  // ── Corner flourishes ──
  const fw=Math.min(100*k,W*0.1);
  menuFlourish(22*k,28*k,fw,'#c8a03a',k,false);
  menuFlourish(W-22*k,28*k,fw,'#c8a03a',k,true);
  menuFlourish(22*k,H-28*k,fw,'#c8a03a',k,false);
  menuFlourish(W-22*k,H-28*k,fw,'#c8a03a',k,true);

  // ── Border frame ──
  ctx.strokeStyle='rgba(212,168,75,.65)';ctx.lineWidth=2.4*k;
  ctx.strokeRect(14*k,14*k,W-28*k,H-28*k);
  ctx.strokeStyle='rgba(212,168,75,.22)';ctx.lineWidth=1*k;
  ctx.strokeRect(22*k,22*k,W-44*k,H-44*k);

  const _mhint=_musicStarted?'♪ Háttérzene szól  ·  🔊 hang: jobb felső sarok':'♪ Kattints bárhova a háttérzenéhez';
  ftxt(_mhint,W/2,H-10,P.inkDark,Math.min(10*k,10),'center');
}
