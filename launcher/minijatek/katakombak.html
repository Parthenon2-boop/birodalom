// ══════════ FLUID MOVEMENT: held-direction auto-repeat ══════════
// Hold a key/dpad button → continuous stepping, smoothly chained.
const held={dx:0,dy:0,active:false};
let lastStepTime=0;
const STEP_MS=150;       // repeat interval while held
const FIRST_DELAY=170;   // brief delay before repeat kicks in
let holdStart=0;
function pressDir(dx,dy){
  held.dx=dx;held.dy=dy;held.active=true;holdStart=performance.now();
  if(gameState==='play'&&world){
    doMove(world,dx,dy);          // instant first step
    lastStepTime=performance.now();
    if(!player.alive)setState('over');
  }else if(gameState==='chest'&&chestUI){chestUI.sel=(chestUI.sel+1)%2;}
}
function releaseDir(dx,dy){
  // Only release if this direction is the currently held one
  if(held.dx===dx&&held.dy===dy){held.active=false;held.dx=0;held.dy=0;}
}
function stepRepeat(now){
  if(!held.active||gameState!=='play'||!world)return;
  if(now-holdStart<FIRST_DELAY)return;
  if(now-lastStepTime>=STEP_MS){
    doMove(world,held.dx,held.dy);
    lastStepTime=now;
    if(!player.alive){setState('over');held.active=false;}
  }
}
// ══════════ KEYBIND CONFIG ══════════
// Default keybinds (editable in "Irányítás" menu)
const DEFAULT_BINDS={
  up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight',
  stair:'Control', inventory:'i', menu:'Escape'
};
let BINDS=Object.assign({},DEFAULT_BINDS);
// Try to load saved binds
try{const saved=localStorage.getItem('kard_binds');if(saved)BINDS=Object.assign({},DEFAULT_BINDS,JSON.parse(saved));}catch(e){}
function saveBinds(){try{localStorage.setItem('kard_binds',JSON.stringify(BINDS));}catch(e){}}

// Keybind editor state
let bindEditorActive=false;  // true = help screen shows editor
let bindEditTarget=null;     // which action is being rebound ('up','down',etc.)

function keyLabel(k){
  if(!k)return '?';
  if(k==='Control')return 'Ctrl';
  if(k==='Shift')return 'Shift';
  if(k==='Alt')return 'Alt';
  if(k==='Escape')return 'Esc';
  if(k==='ArrowUp')return '↑';
  if(k==='ArrowDown')return '↓';
  if(k==='ArrowLeft')return '←';
  if(k==='ArrowRight')return '→';
  if(k===' ')return 'Szóköz';
  if(k==='Enter')return 'Enter';
  return k.length===1?k.toUpperCase():k;
}

// Dynamic dir map (built from BINDS), declared before buildDirMap is called
let KEY_DIRS_DYN={};
// Static WASD/arrow fallback
const KEY_DIRS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
  w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};

function buildDirMap(){
  KEY_DIRS_DYN={};
  KEY_DIRS_DYN[BINDS.up]=[0,-1];
  KEY_DIRS_DYN[BINDS.down]=[0,1];
  KEY_DIRS_DYN[BINDS.left]=[-1,0];
  KEY_DIRS_DYN[BINDS.right]=[1,0];
  // Keep WASD as secondary unless the user rebound them
  for(const[k,v] of [['w',[0,-1]],['s',[0,1]],['a',[-1,0]],['d',[1,0]],
                      ['W',[0,-1]],['S',[0,1]],['A',[-1,0]],['D',[1,0]]]){
    if(!KEY_DIRS_DYN[k])KEY_DIRS_DYN[k]=v;
  }
}
buildDirMap();

document.addEventListener('keyup',e=>{
  const d=KEY_DIRS_DYN[e.key]||KEY_DIRS[e.key];
  if(d)releaseDir(...d);
});
window.addEventListener('blur',()=>{held.active=false;});

// ══════════ KEYBOARD ══════════
document.addEventListener('keydown',e=>{
  const k=e.key;

  // If waiting for a rebind key press
  if(bindEditTarget){
    // Ignore modifier-only presses by themselves only if another key follows;
    // but allow Ctrl/Shift/Alt as standalone binds:
    const forbidden=['Tab','CapsLock','F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12'];
    if(forbidden.includes(k))return;
    BINDS[bindEditTarget]=k;
    saveBinds();
    buildDirMap();
    bindEditTarget=null;
    e.preventDefault();
    return;
  }

  if(gameState==='menu'){if(k==='Enter'){diffSel=1;setState('diff');}}
  else if(gameState==='help'){
    if(k==='Escape'||k==='Enter'){bindEditTarget=null;setState('menu');}
  }
  else if(gameState==='diff'){
    if(k==='ArrowLeft'||k==='a'||k==='ArrowUp')diffSel=(diffSel+2)%3;
    if(k==='ArrowRight'||k==='d'||k==='ArrowDown')diffSel=(diffSel+1)%3;
    if(k==='Enter'){charSel=0;setState('char');}
    if(k==='Escape')setState('menu');
  }else if(gameState==='char'){
    const n=Object.keys(CLASSES).length;
    if(k==='ArrowLeft'||k==='a')charSel=(charSel+n-1)%n;
    if(k==='ArrowRight'||k==='d')charSel=(charSel+1)%n;
    if(k==='Enter')startGame(Object.keys(CLASSES)[charSel],Object.keys(DIFF)[diffSel]);
    if(k==='Escape')setState('diff');
  }else if(gameState==='play'){
    const d=KEY_DIRS_DYN[k]||KEY_DIRS[k];
    if(d){if(!e.repeat)pressDir(...d);e.preventDefault();}
    // Inventory key
    if(k===BINDS.inventory||k===BINDS.inventory.toUpperCase()||k==='i'||k==='I')setState('inv');
    // Stair key (default: Ctrl)
    if(k===BINDS.stair){if(world&&world.tiles[player.x][player.y]===T.STAIR)nextLevel();e.preventDefault();}
    // Legacy stair keys
    if(k==='.'||k==='>'){if(world&&world.tiles[player.x][player.y]===T.STAIR)nextLevel();}
    if(k===BINDS.menu||k==='Escape')setState('menu');
    if(!player.alive)setState('over');
  }else if(gameState==='inv'){
    const items=player.inventory;
    if(k===BINDS.menu||k===BINDS.inventory||k==='Escape'||k==='i'||k==='I')setState('play');
    const code=k.toUpperCase().charCodeAt(0)-65;
    if(code>=0&&code<items.length)doUseItem(world,items[code]);
    e.preventDefault();
  }else if(gameState==='chest'){
    if(!chestUI)return;
    if(k==='ArrowLeft'||k==='a'||k==='ArrowUp')chestUI.sel=0;
    if(k==='ArrowRight'||k==='d'||k==='ArrowDown')chestUI.sel=1;
    if(k==='Enter')pickChestItem();
    if(k==='Escape'){chestUI=null;setState('play');}
  }else if(gameState==='over'||gameState==='win'){
    if(k==='Enter'||k==='Escape')setState('menu');
  }
});

// ══════════ MOBILE DPAD ══════════
function wireMob(id,fn){
  const el=document.getElementById(id);if(!el)return;
  el.addEventListener('touchstart',e=>{e.preventDefault();fn();},{passive:false});
  el.addEventListener('mousedown',fn);
}
// D-Pad: hold to keep walking (fluid), release stops
function wireDpad(id,dx,dy){
  const el=document.getElementById(id);if(!el)return;
  const down=e=>{if(e.cancelable)e.preventDefault();pressDir(dx,dy);};
  const up=()=>releaseDir(dx,dy);
  el.addEventListener('touchstart',down,{passive:false});
  el.addEventListener('touchend',up);
  el.addEventListener('touchcancel',up);
  el.addEventListener('mousedown',down);
  el.addEventListener('mouseup',up);
  el.addEventListener('mouseleave',up);
}
wireDpad('dp-u',0,-1);wireDpad('dp-d',0,1);
wireDpad('dp-l',-1,0);wireDpad('dp-r',1,0);
wireMob('ab-inv',()=>{
  if(gameState==='play')setState('inv');
  else if(gameState==='inv')setState('play');
});
wireMob('ab-stair',()=>{
  if(gameState==='play'&&world&&world.tiles[player.x][player.y]===T.STAIR)nextLevel();
});
wireMob('ab-menu',()=>{
  if(gameState==='play'||gameState==='inv')setState('menu');
  else if(gameState==='chest'&&chestUI){chestUI=null;setState('play');}
});

// ══════════ MAIN LOOP ══════════
let lastFrame=performance.now(),dt=16;
function loop(){
  const now=performance.now();
  dt=Math.min(50,now-lastFrame);lastFrame=now;
  tick+=dt/16.67; // time-normalized tick for animations
  stepRepeat(now); // fluid held-direction movement
  if(canvas.width!==window.innerWidth||canvas.height!==window.innerHeight)resize();
  ctx.clearRect(0,0,W,H);
  hitRegions=[];
  if(gameState==='menu')drawMenu();
  else if(gameState==='help')drawHelp();
  else if(gameState==='diff')drawDiffSel();
  else if(gameState==='char')drawCharSel();
  else if(gameState==='play'||gameState==='inv'||gameState==='chest'){
    if(world){drawWorldScene();drawHUD();}
    if(gameState==='inv')drawInventory();
    if(gameState==='chest')drawChestUI();
  }else if(gameState==='over'){if(world){drawWorldScene();drawHUD();}drawGameOver(false);}
  else if(gameState==='win'){if(world){drawWorldScene();drawHUD();}drawGameOver(true);}
  requestAnimationFrame(loop);
}
loop();
</script>
